# Docker's json-file log driver is unbounded by default — fine for a short-lived
# dev container, not for a daemon meant to run indefinitely. Every service here
# is long-running (restart: unless-stopped), so an unbounded log is a real
# disk-exhaustion vector over time regardless of which one; cap all of them the
# same way rather than guessing which is most at risk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # Resource ceilings below are deliberately generous, not tight — the goal is
  # "one runaway container can't starve the host or the other services," not
  # squeezing every service to its typical footprint. sandbox in particular
  # runs real, sometimes memory/CPU-hungry pentest tools (large wordlists,
  # heavy nmap scans, sqlmap) chosen by the agent/operator, so it gets the most
  # headroom; docker-proxy is a thin socket filter and gets the least.
  # `docker compose up` (Compose V2, non-swarm) honors `deploy.resources.limits`
  # without swarm mode — no extra flags needed.

  # ── gateway — trust boundary ───────────────────────────────────────────────────
  # Dedicated container that installs fail-closed nftables FORWARD rules on the
  # Docker bridge. All of sandbox's outbound traffic is routed through gateway. sandbox stays
  # blocked by default; orchestrator's approval flow dynamically opens targets via IPC.
  #
  # Requires CAP_NET_ADMIN for nftables and net.ipv4.ip_forward for routing.
  gateway:
    container_name: yummi-gateway
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: yummi/gateway:local
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: 1
    security_opt:
      - no-new-privileges:true
    volumes:
      - gateway_ipc:/run/yummi:rw
      - gateway_data:/var/lib/yummi/gateway:rw
    networks:
      yummi_internal:
        ipv4_address: 172.20.0.2
      yummi_external:
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
          pids: 128
        reservations:
          memory: 32m
    healthcheck:
      test: ["CMD", "test", "-S", "/run/yummi/gateway.sock"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── sandbox — unified pentest + desktop container ───────────────────────────
  # ONE Kali environment for everything: the agent's docker-exec path
  # (sandbox.Bridge / sandboxmcp.Client), the operator's Bash tab (tmux), AND
  # the browser-reached graphical desktop (/ws/desktop → noVNC → this
  # container's own websockify+TigerVNC, see sandbox/entrypoint.sh). There
  # used to be a separate opt-in "sandbox-desktop" container for the GUI —
  # unified into this single always-on environment so there is zero
  # tool/environment drift between what the agent can reach and what the
  # operator sees in the Desktop tab. Only on yummi_internal — external
  # traffic is gated through gateway; sandbox sets its default gateway to
  # gateway (172.20.0.2) at startup. See
  # docs/superpowers/specs/2026-09-01-browser-linux-pwnbox-design.md.
  #
  # Trade-off accepted knowingly: NOT read-only (XFCE/VNC/dbus need scattered
  # writable session state) and the desktop stack always runs, not just on
  # request — the network trust boundary is unaffected either way.
  sandbox:
    container_name: yummi-sandbox
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: yummi/sandbox:local
    command: ["/usr/local/bin/entrypoint.sh"]
    # entrypoint.sh execs websockify as its final step, making it PID 1 —
    # websockify is a WebSocket proxy, not an init system, so it never reaps
    # orphaned child processes (no SIGCHLD/wait() loop). Every `docker exec`
    # into this container (the agent's own tool execution path, and the
    # persistent docker-exec-i session internal/sandboxmcp.Client holds open
    # for the whole orchestrator process lifetime) eventually exits as a
    # child reparented to PID 1; without a real init, each becomes a
    # permanent zombie. Found via sustained stress-testing the terminal-
    # session feature (hundreds of docker exec/tmux cycles): zombies
    # accumulated until hitting the container's default 512-PID cgroup
    # ceiling, at which point fork() started failing for EVERYTHING in the
    # container, not just the new feature — tmux, the agent's shell
    # commands, all of it. `init: true` asks Docker Compose to inject its
    # own built-in minimal init (tini) as the REAL PID 1; entrypoint.sh (and
    # therefore websockify) then runs as its child, and tini reaps every
    # orphan automatically — the standard, zero-extra-dependency fix for
    # exactly this class of bug.
    init: true
    # Resolve names via Cloudflare DNS (not Docker's embedded resolver), so the
    # sandbox and the orchestrator (which resolves the same names through
    # Cloudflare before opening a gateway rule) agree on the target IPs. DNS
    # itself is not the trust boundary — the query still egresses through the
    # gateway (udp/53 is accepted), and the actual connection to the resolved IP
    # is gated by nftables. Resolution only maps name→IP; reachability is the
    # gateway's call.
    dns:
      - "1.1.1.1"
      - "1.0.0.1"
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /run:size=64m,mode=755
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
      # CHOWN/FOWNER/DAC_OVERRIDE: the entrypoint (root) prepares the
      # pentester user's home directory and the tmpfs-mounted runtime dir
      # before dropping to that user for the desktop session — cap_drop ALL
      # removes even root's normal filesystem-permission bypass, so this is
      # the real minimal set for that one-time, startup-only filesystem prep
      # (live-verified: mkdir into a dir pentester already owns failed with
      # plain "Permission denied" without DAC_OVERRIDE, and chmod on a dir
      # chown already moved to pentester failed without FOWNER — root alone
      # isn't enough once capabilities are this tightly scoped). Never
      # exposed to a pentest command itself.
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      # SETUID/SETGID: `su - pentester` (the entrypoint's privilege-drop
      # mechanism for the VNC/XFCE session) calls setgroups()/setuid()
      # internally, which need these explicitly once cap_drop ALL is in
      # effect; without them `su` itself fails before ever reaching the
      # desktop session.
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:false
    volumes:
      - ${HOME}/.yummi/wordlists:/wordlists:ro
      - ${HOME}/.yummi/workspace:/workspace:rw
      - ${HOME}/.yummi/payloads:/payloads:ro
    networks:
      yummi_internal:
        ipv4_address: 172.20.0.10
    restart: unless-stopped
    logging: *default-logging
    # Generous relative to the others — this container runs the actual
    # pentest tools an operator/agent chooses (nmap against wide ranges,
    # sqlmap, hydra, large wordlist fuzzing) AND the desktop session
    # (XFCE/Firefox/Wireshark). pids is fork-bomb / runaway-brute-force
    # insurance, not a normal-use ceiling.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
          pids: 512
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:6080/ > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── orchestrator — orchestrator ─────────────────────────────────────────────────────────
  # Go API server. Talks to gateway via IPC socket and to sandbox via docker exec.
  # On yummi_external for Ollama access (host.docker.internal).
  orchestrator:
    container_name: yummi-orchestrator
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    image: yummi/orchestrator:local
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      YUMMI_ORCHESTRATOR_HOST: "0.0.0.0"
      YUMMI_ORCHESTRATOR_PORT: "9080"
      YUMMI_DB_PATH: "/var/lib/yummi/orchestrator/sessions.db"
      YUMMI_GATEWAY_SOCKET: "/run/yummi/gateway.sock"
      YUMMI_SANDBOX_CONTAINER: "yummi-sandbox"
      YUMMI_PERSONA_DIR: "/persona/v0.1"
      YUMMI_AUTO_SKILL_DIR: "/var/lib/yummi/orchestrator/skills"
      YUMMI_OLLAMA_URL: "http://host.docker.internal:11434"
      YUMMI_OLLAMA_MODEL: "${YUMMI_OLLAMA_MODEL:-}"
      YUMMI_OLLAMA_TIER: "${YUMMI_OLLAMA_TIER:-standard}"
      # Overrides for a custom YUMMI_OLLAMA_MODEL tag that isn't one of the
      # two named tiers — see conductor.TierOverrides. Both blank by default
      # (no override; a custom model still gets Standard's fixed 32K context/
      # no-thinking profile unless set here).
      YUMMI_OLLAMA_NUM_CTX: "${YUMMI_OLLAMA_NUM_CTX:-}"
      # Optional: point ONLY the Eino agent backend's ReAct loop at a
      # different OpenAI-compatible server/model than Ollama — e.g. a local
      # LM Studio instance running a larger tool-calling model on the same
      # host. All three blank by default, in which case the orchestrator
      # derives the exact same target it always has (Ollama's own
      # OpenAI-compat endpoint above) — purely additive, no behavior change
      # until set. The host.docker.internal extra_hosts entry below already
      # covers reaching a host-run server on any port, so no new networking
      # is needed — just set the port your server actually listens on, e.g.
      # YUMMI_EINO_MODEL_BASE_URL=http://host.docker.internal:1234/v1. The
      # conductor (chat/intent classification) is unaffected either way; it
      # always uses YUMMI_OLLAMA_URL/MODEL above regardless of this override.
      YUMMI_EINO_MODEL_BASE_URL: "${YUMMI_EINO_MODEL_BASE_URL:-}"
      YUMMI_EINO_MODEL_NAME: "${YUMMI_EINO_MODEL_NAME:-}"
      YUMMI_EINO_MODEL_API_KEY: "${YUMMI_EINO_MODEL_API_KEY:-}"
      YUMMI_EINO_PROVIDER: "${YUMMI_EINO_PROVIDER:-}"
      YUMMI_EINO_MODEL_NUM_CTX: "${YUMMI_EINO_MODEL_NUM_CTX:-}"
      YUMMI_OLLAMA_THINKING: "${YUMMI_OLLAMA_THINKING:-}"
      YUMMI_AGENT_BACKEND: "${YUMMI_AGENT_BACKEND:-graph}"
      # Background pruning of old chat_messages/agent_activity/executions
      # rows — disabled (0) by default, see internal/retention's package doc
      # for exactly what is and is never pruned. Opt in with a day count,
      # e.g. YUMMI_DATA_RETENTION_DAYS=90.
      YUMMI_DATA_RETENTION_DAYS: "${YUMMI_DATA_RETENTION_DAYS:-0}"
      DOCKER_HOST: "tcp://docker-proxy:2375"
      # Network scope is configured exclusively via the gateway's own YAML
      # config (scope.allow / scope.block in gateway/config/default.yaml) —
      # the orchestrator no longer reads any scope env vars.
    ports:
      - "127.0.0.1:9080:9080"
    # host-gateway resolves host.docker.internal on native Linux Docker Engine
    # (Docker Desktop on macOS/Windows already provides this mapping natively;
    # this entry is a harmless no-op there). Without it, YUMMI_OLLAMA_URL above
    # fails to resolve on Linux hosts and the conductor can never reach Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gateway_ipc:/run/yummi:ro
      - orchestrator_data:/var/lib/yummi/orchestrator:rw
      - ./persona:/persona:ro
    networks:
      yummi_internal:
        ipv4_address: 172.20.0.3
      yummi_external:
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g
          pids: 256
        reservations:
          memory: 128m
    depends_on:
      gateway:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── docker-proxy — secure docker API socket filter ──────────────────────────────
  # orchestrator's only real Docker need is `docker exec`/`docker inspect` into
  # yummi-sandbox (sandbox.Bridge, internal/sandbox/bridge.go) — never create,
  # kill, or otherwise manage containers. POST=1 is required for EXEC to work
  # (creating + starting an exec instance are POST calls), but combined with
  # CONTAINERS=1 it would ALSO unlock generic container lifecycle control
  # (start/stop/restart/kill/rename/prune) on every container reachable on this
  # network unless explicitly denied — ALLOW_START/ALLOW_STOP/ALLOW_RESTARTS
  # close that gap. Every other resource family is explicitly zeroed so the
  # allowlist is self-documenting instead of relying on the image's defaults.
  docker-proxy:
    container_name: yummi-docker-proxy
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      IMAGES: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      yummi_internal:
        ipv4_address: 172.20.0.5
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64m
          pids: 64
        reservations:
          memory: 16m
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2375"]
      interval: 10s
      timeout: 5s
      retries: 3


  # ── yummi-ui — React dashboard ────────────────────────────────────────────────
  yummi-ui:
    container_name: yummi-ui
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_YUMMI_LANG: ${VITE_YUMMI_LANG:-en}
    image: yummi/ui:local
    ports:
      - "127.0.0.1:3000:80"
    networks:
      yummi_internal:
        ipv4_address: 172.20.0.4
      yummi_external:
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
          pids: 64
        reservations:
          memory: 32m
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  gateway_ipc:
    name: yummi_gateway_ipc
  gateway_data:
    name: yummi_gateway_data
  orchestrator_data:
    name: yummi_orchestrator_data

networks:
  yummi_internal:
    name: yummi_internal
    driver: bridge
    # internal: true means no external connectivity for containers on this network.
    # sandbox is ONLY on this network — it reaches external via gateway (its gateway).
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
  yummi_external:
    name: yummi_external
    driver: bridge
