version: "0.1"
tier: "lite"
model: "qwen3:4b"

description: >
  Lightweight tier for fast responses on resource-constrained systems.
  Suitable for single-step operations and straightforward reconnaissance.

capabilities:
  context_window: 8192
  thinking_mode: false
  strengths:
    - "Fast inference (typically under 3 seconds)"
    - "Low VRAM requirement (~3GB)"
    - "Reliable JSON output for simple requests"
    - "Adequate for single-phase operations"
  limitations:
    - "Reduced multi-step reasoning depth"
    - "May require more explicit operator guidance"
    - "Less reliable on ambiguous or complex scenarios"

behavior_adjustments:
  - "Keep proposals to a single step when possible"
  - "Prefer explicit, unambiguous operator inputs"
  - "For complex scenarios, acknowledge limitation and ask operator to break task into steps"

recommended_for:
  - "Single-target, single-phase operations"
  - "Quick checks and simple enumeration"
  - "Resource-limited or edge environments"
