# NOTE: this file is reference documentation only — it is not loaded by any
# Go code (the real model/context/thinking-mode values are hardcoded in
# orchestrator/internal/conductor/tier.go's DefaultTierRegistry()). Keep this
# description in sync with tier.go by hand; editing only this file changes
# nothing at runtime.
version: "0.1"
tier: "standard"
model: "gpt-oss:20b"

description: >
  OpenAI's smaller open-weight model (MXFP4 quantization, ~90% of its
  parameters are MoE experts). The recommended default for most authorized
  engagements — runs on 16GB+ RAM without a dedicated GPU, and its native
  function-calling is reliable enough that Yummi's Eino backend (structured
  tool calls, not the tag-protocol graph engine) is the recommended pairing.

capabilities:
  context_window: 32768
  thinking_mode: false
  strengths:
    - "Native, reliable tool-calling — pairs well with the Eino backend's structured tool schemas"
    - "Runs on 16GB+ system RAM without a dedicated GPU (MXFP4 quantization)"
    - "Handles multi-part goals correctly with Yummi's complexity-scaled step budget"
    - "Consistent structured output for finish/findings summaries"
  limitations:
    - "Occasional malformed tool-call arguments under sustained multi-turn load (Yummi retries once, bounded)"
    - "Sometimes routes its real answer into its internal reasoning channel instead of the final response — Yummi recovers this automatically"

behavior_adjustments:
  - "Suitable for multi-step, multi-part proposals within a single engagement"
  - "Sub-agent delegation (HANDOFF) works reliably for splitting off a focused sub-task"

recommended_for:
  - "Standard web and network assessments"
  - "Typical authorized penetration tests"
  - "Multi-target scoping with moderate complexity"
