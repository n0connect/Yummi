schema_version: 1
version: 3.0.0
name: subdomain-takeover-advanced
description: >
  Advanced DNS zone delegation, lame delegation, MX mail exchange takeover, and CDN alternate domain
  routing collisions. Covers Route53 hosted zone namespace collisions, dangling NS delegation, and
  cross-tenant cloud edge distribution claims.
triggers:
  - ns delegation takeover
  - zone hijacking
  - mx takeover
  - dangling ns
  - second-order takeover
  - lame delegation
  - cloudfront takeover
tools:
  - subfinder
  - httpx
  - curl
  - python3
knowledge: |
  Advanced DNS takeovers exploit authoritative delegation boundaries, mail exchange routing, and CDN
  multi-tenant distribution bindings rather than simple dangling CNAME pointers.

  1. LAME DELEGATION & NAMESERVER (NS) ZONE HIJACKING:
     When an enterprise delegates a subdomain zone (e.g. dev.target.com) to external nameservers:
     - Query NS records for the subdomain:
       dig NS dev.target.com +short
     - Vulnerability Check (AWS Route53 / Azure DNS):
       If the delegated nameservers (e.g. ns-123.awsdns-15.com) point to a deleted Route53 hosted zone:
       Route53 assigns nameservers randomly from a pool of ~2000 nameservers.
       An adversary can script creating and deleting Route53 zones until AWS assigns the exact matching
       4 nameservers, seizing 100% authoritative control over the ENTIRE dev.target.com zone!
     - Detection:
       dig dev.target.com SOA returns REFUSED or SERVFAIL from delegated nameservers.

  2. MX RECORD TAKEOVER & EMAIL ROUTING HIJACK:
     When MX records point to decommissioned email services:
     - Query MX records:
       dig MX target.com +short
     - If the MX points to a third-party service (e.g. mail.old-marketing-vendor.com) that was deleted:
       An adversary can re-register the domain or tenant on that marketing platform, creating valid
       mailboxes that intercept all incoming corporate emails, password resets, and internal communications.

  3. CLOUDFRONT / AZURE FRONT DOOR ALTERNATE DOMAIN COLLISIONS:
     When a domain points to a CDN distribution (e.g. d12345.cloudfront.net) but the distribution
     is deleted while the CNAME remains in DNS:
     - CloudFront requires adding an "Alternate Domain Name (CNAME)" with TLS certificate validation.
     - However, in multi-tenant CDNs without certificate verification, an adversary can attach the
       unclaimed domain to their own CDN distribution, serving arbitrary content.

  4. NON-DESTRUCTIVE PROOF DISCIPLINE:
     - For NS delegation: capture authoritative SOA SERVFAIL queries proving nameserver abandonment.
     - For MX: record MX host resolution failure or service registration availability without intercepting traffic.
     - Document exact DNS RR sets (Record Type, TTL, Canonical target) and registrar configuration.
