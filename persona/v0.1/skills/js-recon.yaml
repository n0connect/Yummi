schema_version: 1
version: 3.0.0
name: js-recon
description: Senior client-side JavaScript architecture analysis — Webpack/Vite chunk mapping, React/Vue routing table extraction, and hidden API endpoint discovery.
triggers:
  - javascript
  - js
  - js mining
  - js analysis
  - client side
  - webpack
  - vite
  - react router
  - spa routing
tools:
  - katana
  - curl
  - rg
knowledge: |
  Extract hidden API endpoints, client-side routing tables, and single-page application (SPA) architectures with senior red-team precision.

  1. JAVASCRIPT ASSET CRAWLING & CHUNK HARVESTING:
     Modern web applications bundle code into asynchronous, dynamically-loaded chunks:
     - Crawl Application Scripts:
       `katana -u "<target_url>" -jc -d 2 -o /home/pentester/work/js_urls.txt`
     - Webpack & Vite Runtime Chunk Analysis:
       Inspect the main entrypoint bundle (`app.js`, `main.js`, `runtime.js`) for the chunk-loading map:
       Look for chunk mapping arrays: `__webpack_require__.u = function(chunkId) { ... }` or `import("/assets/" + chunk + ".js")`.
       Download all secondary chunks to discover administrative dashboards and unlinked features.

  2. CLIENT-SIDE ROUTING TABLE RECONSTRUCTION:
     Frontend routing frameworks (React Router, Vue Router, Angular RouterModule, Next.js Pages/App router) declare the application's entire page hierarchy in client-side code:
     - Extract Declared Route Paths:
       `rg -o -e 'path\s*:\s*["'\''"][^"'\'']+["'\''"]' /home/pentester/work/js_bundles/ | sort -u`
       `rg -o -e '<Route\s+[^>]*path=["'\''"][^"'\'']+["'\''"]' /home/pentester/work/js_bundles/`
     - High-Value Discovered Routes:
       Look for unlinked administrative interfaces: `/admin/*`, `/internal/*`, `/superadmin/*`, `/debug/*`, `/dashboard/settings/tenants`.

  3. API ENDPOINT & CONTRACT HARVESTING:
     Extract all hardcoded API routes, backend services, and parameter signatures:
     - Route Pattern Extraction:
       `rg -o -i -e '["'\''](\/api\/[a-zA-Z0-9_\-\/]+)["'\'']' /home/pentester/work/js_bundles/ | sort -u`
       `rg -o -i -e '["'\''](\/v[0-9]\/[a-zA-Z0-9_\-\/]+)["'\'']' /home/pentester/work/js_bundles/ | sort -u`
     - Axios & Fetch Call Analysis:
       Extract HTTP methods and headers passed to backend services:
       `rg -C 3 -e 'axios\.(get|post|put|delete|patch)\(' /home/pentester/work/js_bundles/`
       `rg -C 3 -e 'fetch\(' /home/pentester/work/js_bundles/`

  4. SOURCE MAP VERIFICATION:
     - Check if production builds accidentally exposed source maps:
       `curl -s -I "<bundle_url>.map" | grep -iE '^(http/|content-type:)'`
     - A 200 response confirms unminified source code availability.

  5. VERIFICATION & PIPELINE EFFICIENCY:
     - Save all discovered endpoints to a unified file (`/home/pentester/work/discovered_endpoints.txt`) in a single pass.
     - Hand off discovered routes directly to `api-pentest` or `idor-bfla` for authorization evaluation.
