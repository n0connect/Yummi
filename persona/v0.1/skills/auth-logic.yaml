knowledge: |
  Audit authentication architectures, cryptographic tokens, and state machines with senior red-team precision.

  1. JSON WEB TOKEN (JWT) CRYPTOGRAPHIC ATTACKS:
     - Token Claim Inspection:
       Decode base64url header and payload: inspect `alg`, `typ`, `kid`, `jku`, `iss`, `sub`, `exp`, `role`.
     - The `alg: none` Vulnerability:
       Tamper token header to `"alg": "none"` (or `"alg": "None"`), modify claims (e.g. `"role": "admin"`), and strip the signature component (preserving the trailing dot `.`):
       `jwt_tool <token> -X a`
     - Key Confusion Attack (RS256 -> HS256):
       If the backend uses an asymmetric RSA public key to verify signatures, re-sign the token using symmetric HMAC-SHA256 where the HMAC secret is set to the server's public key (PEM format):
       `jwt_tool <token> -T -S hs256 -k <public_key.pem>`
     - Header Parameter Injection (`kid` / `jku`):
       Probe SQLi, command injection, or path traversal inside the `kid` header parameter:
       e.g., `"kid": "../../../dev/null"` (where secret becomes empty string) or `"kid": "key1' OR '1'='1"`.
     - Offline HMAC Secret Cracking:
       Crack weak signing secrets locally without network noise:
       `jwt_tool <token> -C -d $PASSWORDS_TOP`

  2. OAUTH2 FLOW & REDIRECT_URI TAMPERING:
     - Test `redirect_uri` validation against open redirects and path traversal:
       • Parameter pollution: `&redirect_uri=https://trusted.com&redirect_uri=https://attacker.com`
       • Subdomain bypass: `https://trusted.com.attacker.com`
       • Path traversal: `https://trusted.com/oauth/callback/../../attacker`
     - Verify `state` parameter enforcement; missing or unvalidated `state` allows Cross-Site Request Forgery (CSRF) in account linking flows.

  3. MULTI-FACTOR AUTHENTICATION (MFA / 2FA) LOGIC FLAWS:
     - Direct Route Access: Check if navigating directly to post-auth endpoints (`/dashboard`, `/profile`) succeeds after step 1 without completing step 2.
     - Response Code Manipulation: Test intercepting and modifying the 2FA verification response from `{"status": "fail"}` or `401 Unauthorized` to `{"status": "success"}` or `200 OK`.
     - Rate-Limiting Check: Probe OTP endpoints with sequential inputs to check if brute-force protection is enforced.

  4. EVIDENCE COLLECTION:
     - Document original token, manipulated token, request/response headers, and proof of elevated privilege.
