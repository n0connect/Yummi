schema_version: 1
version: 2.0.0
name: source-analysis
description: Senior static application security testing (SAST) — dependency auditing, untrusted input sink tracing, secret detection, and code vulnerability mapping.
triggers:
  - source
  - source code
  - code review
  - codebase
  - repo
  - repository
  - static analysis
  - sast
  - vulnerability
  - audit
  - code audit
  - secrets scan
tools:
  - grep
  - rg
  - git
knowledge: |
  Perform static application security testing (SAST) systematically across the target repository:

  1. MANIFEST & DEPENDENCY TRIAGE:
     - Inspect project descriptors to identify the framework, language version, and third-party dependencies:
       `find . -maxdepth 2 -name "package.json" -o -name "go.mod" -o -name "pom.xml" -o -name "requirements.txt" -o -name "Cargo.toml"`

  2. DANGEROUS INPUT-TO-SINK TRACING:
     - Command Execution / Injection: `rg -n -i -e '(exec|spawn|os\.system|subprocess|eval|Runtime\.getRuntime)'`
     - SQL Query Concatenation: `rg -n -i -e '(SELECT|INSERT|UPDATE|DELETE).*\+.*' -e 'rawQuery|db\.query'`
     - Path Traversal & File System Access: `rg -n -i -e '(fs\.readFile|open\(|FileInputStream|os\.Open).*\+'`
     - Insecure Deserialization & Template Injection: `rg -n -i -e '(pickle\.loads|unserialize|yaml\.load\(|render_template_string)'`

  3. HARDCODED SECRET & KEY EXTRACTION:
     - Scan for exposed credentials, private keys, and API tokens:
       `rg -n -i -e '(api_key|jwt_secret|private_key|aws_access_key|client_secret|password)\s*[:=]\s*["'\''][^"'\'']+'`

  4. STRUCTURED EVIDENCE:
     - Record findings with exact `file_path:line_number`, code context snippets, and the data flow path from input to sink.
references:
