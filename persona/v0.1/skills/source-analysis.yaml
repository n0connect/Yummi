schema_version: 1
version: 3.0.0
name: source-analysis
description: >
  Manual source code security review and architectural taint analysis — tracing user-controlled
  inputs to dangerous sinks, inspecting authorization check logic, and analyzing framework configurations.
triggers:
  - code review
  - manual code review
  - taint analysis
  - source audit
  - codebase review
  - sink analysis
  - source-to-sink
tools:
  - rg
  - git
  - python3
knowledge: |
  Manual code review uncovers deep logic flaws, authorization gaps, and complex taint flows that
  automated scanners routinely miss. Trace data from entry points (sources) to dangerous functions (sinks).

  1. SOURCE IDENTIFICATION (ENTRY POINTS):
     Locate where external user input enters the application:
     - HTTP Request Handlers:
       Express/Fastify: `req.body`, `req.query`, `req.params`, `req.headers`
       Django/Flask: `request.POST`, `request.GET`, `request.json`, `request.form`
       Spring/Java: `@RequestParam`, `@RequestBody`, `@PathVariable`, `HttpServletRequest`
       Go: `r.URL.Query()`, `r.FormValue()`, `json.NewDecoder(r.Body).Decode()`
     - Asynchronous & Background Sources:
       Message queues (RabbitMQ, Kafka, SQS consumers), Redis pub/sub, WebSocket message handlers.

  2. TAINT TRACKING (SOURCE-TO-SINK DATAFLOW):
     Trace input variables through transformations, sanitizers, and validation gates:
     - Sanitization Gaps:
       Look for custom regex replaces (e.g. `str.replace("../", "")` which bypasses with `....//`).
       Look for type coercion quirks (e.g. `typeof id === 'string'` bypassed with arrays/objects).
     - Missing Validation in Internal Services:
       When developers validate input at the edge controller but omit validation in internal service functions.

  3. DANGEROUS SINKS BY VULNERABILITY CLASS:
     - Command Execution: `exec()`, `spawn()`, `os.system()`, `Runtime.getRuntime().exec()`, `ProcessBuilder`
     - SQL Injection: String concatenation in queries: `WHERE id = " + id`, raw SQL builders without parameterization.
     - Deserialization: `pickle.loads()`, `unserialize()`, `yaml.load(without SafeLoader)`, `readObject()`
     - Path Traversal: `fs.readFile()`, `open()`, `File()`, `Path.resolve()` concatenated with input.
     - Server-Side Template Injection: `render_template_string()`, `mark_safe()`, `Template.compile()`

  4. AUTHORIZATION LOGIC AUDIT:
     - Horizontal Authorization (IDOR): Verify if the database query binds to `auth.userId` or if it only filters by `req.params.id`.
     - Vertical Authorization (Privilege Escalation): Check if role checks are performed on every mutation or only at the router level.
     - State Machine & Workflow Skips: Check if multi-step checkouts or onboarding can jump directly to the final confirmation endpoint.

  5. REPORTING & EVIDENCE:
     - Provide the exact file path, line numbers, and call stack trace from source to sink.
     - Provide a minimal reproducible test case (e.g. HTTP curl command) triggering the identified code path.
references:
  - https://owasp.org/www-project-code-review-guide/
  - https://cwe.mitre.org/
provenance:
