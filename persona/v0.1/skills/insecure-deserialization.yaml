schema_version: 1
version: 3.0.0
name: insecure-deserialization
description: >
  Native object deserialization security assessment across Python, PHP, and .NET.
  Covers Python pickle opcodes, PHP unserialize() POP chains and phar:// stream wrapper metadata,
  .NET BinaryFormatter ObjectDataProvider gadgets, and safe non-destructive oracle testing.
triggers:
  - pickle
  - unserialize
  - binaryformatter
  - php object injection
  - phar metadata
  - native serialization
  - objectinputstream
tools:
  - python3
knowledge: |
  Native deserialization unmarshals binary byte streams directly into in-memory object graphs.
  When applications accept serialized objects from untrusted sources, arbitrary object instantiation
  and method invocation occur before any application validation logic executes.

  1. MAGIC BYTE SIGNATURES & ENCODED STREAM DETECTION:
     Inspect cookies, Authorization headers, and POST bodies for native stream markers:
     - Python Pickle: starts with opcode bytes (hex \x80\x02, \x80\x03, \x80\x04).
     - PHP Native Serialized: plaintext class definitions: `O:<len>:"<class>":<props>:{...}` or arrays `a:<len>:{...}`.
     - .NET BinaryFormatter: starts with header bytes `00 01 00 00 00 ff ff ff ff` (base64 `AAEAAAD/////`).

  2. PYTHON PICKLE INJECTION & OPCODES:
     Python pickle executes callable routines during unmarshaling via the `__reduce__` protocol:
     Payload construction (non-destructive canary):
       python3 -c "
       import pickle, base64
       class Canary(object):
           def __reduce__(self):
               import os
               return (os.system, ('echo PICKLE_CONFIRMED',))
       print(base64.b64encode(pickle.dumps(Canary())).decode())
       "
     If the target outputs `PICKLE_CONFIRMED` or triggers a timing delay, code execution is verified.

  3. PHP OBJECT INJECTION & PHAR ARCHIVES:
     - Direct `unserialize()` Sink:
       Target magic methods executed upon lifecycle events: `__wakeup()`, `__destruct()`, `__toString()`.
       Assemble Property-Oriented Programming (POP) chains from existing codebase classes (monolog, laravel, guzzle).
     - Phar Stream Wrapper Deserialization:
       Any PHP filesystem function (file_exists, is_readable, md5_file, getimagesize) operating on a `phar://` URI
       automatically deserializes the archive's internal manifest metadata without needing `unserialize()`!

  4. .NET BINARYFORMATTER & OBJECTDATAPROVIDER:
     BinaryFormatter is inherently vulnerable to untrusted input.
     Gadget chains leverage `System.Windows.Data.ObjectDataProvider` to invoke methods on arbitrary assemblies.
     Target ViewState when MAC validation (`EnableViewStateMac="false"`) or ViewState encryption is disabled.

  5. SITUATION HANDLING & SAFETY DISCIPLINE:
     - Always test with benign canary commands (`id`, `whoami`, or DNS callbacks) before escalating.
     - If the target returns 500 Internal Server Error without output, check if the runtime throws ClassNotFoundException:
       This indicates the deserialization sink exists, but the required gadget library is not on the classpath.
