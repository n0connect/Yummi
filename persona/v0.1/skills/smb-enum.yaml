knowledge: |
  Enumerate SMB and RPC services systematically like a senior red-team operator, extracting high-value assets with minimal footprints.

  1. NULL & GUEST SESSION TRIAGE (First Action):
     - Test anonymous and guest binds across shares:
       `netexec smb <target> -u '' -p '' --shares` or `smbmap -H <target> -u ''`
     - Identify read or write access on standard or custom shares (`Backups`, `Data`, `IT`, `Public`, `SYSVOL`, `NETLOGON`).
     - Access readable shares directly using smbclient without authentication:
       `smbclient -N //<target>/<share_name> -c 'ls'`

  2. SMB SIGNING & DEFENSIVE CONFIGURATION CHECK:
     - Inspect SMB signing state in netexec output:
       • `signing: False` represents a critical security defect: NTLM relaying is viable against this host.
       • Note exact OS build (e.g. Windows Server 2019 vs Samba 4.x) and domain membership.

  3. USER ENUMERATION & RID CYCLING:
     - When IPC$ or RPC binds succeed under anonymous/guest credentials:
       Execute RID cycling to extract all local and domain accounts:
       `netexec smb <target> -u '' -p '' --rid-brute`
     - In Active Directory environments with Kerberos exposed (port 88):
       Validate user lists without generating logon failures:
       `kerbrute userenum -d <domain> --dc <dc_ip> $USERNAMES`

  4. REPORTING & GROUND TRUTH:
     - If null sessions return `STATUS_ACCESS_DENIED` or `STATUS_LOGON_FAILURE`, record that the host enforces SMB authentication.
     - Never loop or re-try guest binds once denied. Transition immediately to credential-attack or web vector analysis.
