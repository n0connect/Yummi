knowledge: |
  SMB and Active Directory enumeration recovers high-value intelligence from null or authenticated sessions:
  1. Null session & share check:
     - `netexec smb <target> -u '' -p '' --shares` or `smbmap -H <target> -u ''` for fast share triage.
     - `enum4linux -a <target>` for a full legacy sweep (OS, users, groups, shares, password policy).
  2. Domain user enumeration & Kerberos pre-auth (when domain name is known):
     - `kerbrute userenum -d <domain> --dc <dc_ip> $USERNAMES` for stealthy, lockout-free user validation.
     - `netexec smb <target> -u '' -p '' --users`
  3. Shares and permissions:
     - Check read/write permissions on accessible shares (`smbclient -N -L //<target>`).
     - Valid usernames feed subsequent credential-attack workflows.
  4. Record SMB signing status (Signing: False indicates NTLM relay opportunity), OS build, and domain name.
  5. A refused null session is itself a valid finding (target enforces authentication) — report plainly rather than treating as an error.
