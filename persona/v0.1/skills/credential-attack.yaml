knowledge: |
  Credential attacks are noisy and can lock out accounts — always confirm scope and proceed with rate discipline:
  1. Leverage Pre-exported Wordlists:
     - Use `$PASSWORDS_TOP` (`10-million-password-list-top-1000.txt`) for initial fast credential probes.
     - Use `$USERNAMES` (`top-usernames-shortlist.txt`) for targeted user discovery.
     - Reserve `$ROCKYOU` for offline hash cracking or confirmed non-lockout targets.
  2. Password Spraying vs Brute Force:
     - For Active Directory / SMB / WinRM, prefer password spraying (1 password across all accounts)
       using `netexec smb <target> -u $USERNAMES -p 'Spring2026!' --continue-on-success` or `kerbrute passwordspray`.
     - Avoid wide matrix attacks (user_list x pass_list) which trigger account lockout thresholds.
  3. Service-Specific Attacks:
     - Confirm service identity and ports before launching `hydra -l <user> -P $PASSWORDS_TOP <target> <service>`.
     - Stop at first success (`-f` flag in hydra).
  4. Findings & Evidence:
     - Record the service, target IP/port, username, and valid login status.
     - Never persist plain-text passwords in unencrypted notes or final findings.
