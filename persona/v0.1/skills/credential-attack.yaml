schema_version: 1
version: 1.0.0
name: credential-attack
description: Online credential brute-forcing against network services with hydra/medusa.
triggers:
  - brute force
  - bruteforce
  - credential
  - credentials
  - password spray
  - hydra
  - medusa
  - login
  - weak password
tools:
  - hydra
  - medusa
knowledge: |
  Credential attacks are noisy and can lock out accounts — always confirm scope explicitly
  covers this before running:
  1. Confirm the service first (ssh/ftp/http-post-form/etc.) with a quick banner grab or the
     web skill's fingerprinting — don't guess the module.
  2. Prefer a single verified/likely username over a wide user list when one is known — a
     user_list x pass_list cross product multiplies noise and lockout risk.
  3. Start with a small, high-quality wordlist (common/top-100) before a large one — most real
     findings come from weak/default credentials, not exhaustive search.
  4. Stop at first success per account — a confirmed valid credential is the finding; continuing
     to brute-force past it just adds noise and lockout risk for no new evidence.
  5. Record the exact service, username, and that a valid credential was found — never the
     password itself in a finding or memory (secrets don't belong in persisted text).
references:
  - persona:credential-attack-v1
