knowledge: |
  Fuzz parameter values, test input boundaries, and analyze differential server behaviors with senior red-team precision.

  1. CALIBRATED DIFFERENTIAL RESPONSE FUZZING:
     - Always baseline dynamic server response size before fuzzing to filter false positives:
       `BASE_SIZE=$(curl -s "<url>?invalid_key_probe_xyz=1" | wc -c)`
       `BASE_WORDS=$(curl -s "<url>?invalid_key_probe_xyz=1" | wc -w)`
     - Fuzz GET Query Parameter Names:
       `ffuf -u "<url>?FUZZ=test" -w /usr/share/seclists/Discovery/Web-Content/burp-parameter-names.txt -mc 200,302 -fs $BASE_SIZE`
     - Fuzz POST JSON Request Keys:
       `ffuf -u "<url>" -X POST -H "Content-Type: application/json" -d '{"FUZZ":"test"}' -w /usr/share/seclists/Discovery/Web-Content/burp-parameter-names.txt -mc 200,201,302 -fs $BASE_SIZE`

  2. PARAMETER BOUNDARY & TYPE CONFUSION TESTING:
     - Array / Object Mutation:
       Convert scalar parameters to arrays: `id[]=1`, `id[0]=1`, `id[$ne]=null` (NoSQL injection probe).
     - Integer Overflows & Boundary Values:
       Test boundary values: `0`, `-1`, `2147483647`, `9223372036854775807`, `NaN`, `Infinity`.
     - Null Byte & Format Strings:
       Inject `%00`, `%0d%0a`, `%s%s%s%s`, `{{7*7}}`.

  3. REFLECTION & XSS CONTEXT CONFIRMATION:
     - Identify parameters whose values are reflected in the HTML body or HTTP response headers.
     - Execute context-aware verification using dalfox:
       `dalfox url "<url>?<param>=test" --silence --skip-bav`
     - Record confirmed reflections, escaping contexts (attribute, script tag, innerHTML), and working verification vectors.

  4. TRIAGE & EVIDENCE CONSOLIDATION:
     - Isolate verified parameter vulnerabilities, group by attack class (Reflection, Boundary Error, Logic Variation), and forward to specialized exploitation skills.
