knowledge: |
  Discover hidden query and body parameters with senior red-team differential analysis and zero false-positive floods.

  1. CALIBRATED DIFFERENTIAL RESPONSE FUZZING:
     - Uncalibrated parameter fuzzing creates false-positive noise due to dynamic server timestamps or reflected query strings.
     - Always baseline the response length: `curl -s "<url>?invalid_key_xyz=1" | wc -c`
     - Filter baseline size using `-fs <baseline_size>` or word count using `-fw <baseline_words>`.
     - Fuzz GET Query Parameters:
       `ffuf -u "<url>?FUZZ=test" -w $COMMON_TXT -mc 200,302 -fs <baseline_size>`
     - Fuzz POST JSON Request Keys:
       `ffuf -u "<url>" -X POST -H "Content-Type: application/json" -d '{"FUZZ":"test"}' -w $COMMON_TXT -mc 200,201,302 -fs <baseline_size>`

  2. HIGH-VALUE SECURITY PARAMETER MATRIX:
     - Prioritize testing against high-impact parameter families:
       • File Inclusion & SSRF: `file`, `path`, `doc`, `url`, `dest`, `redirect`, `uri`, `domain`, `src`, `load`, `page`
       • Debugging & Privileged State: `debug`, `test`, `admin`, `root`, `role`, `priv`, `show_debug`, `impersonate`
       • Command Injection & Code Eval: `cmd`, `exec`, `command`, `run`, `ping`, `query`, `eval`

  3. REFLECTION & XSS VERIFICATION:
     - Identify parameters whose values are reflected in HTML or HTTP headers.
     - Test for context-aware cross-site scripting confirmation using dalfox:
       `dalfox url "<url>?<param>=test"`
     - A dalfox hit is verified proof of vulnerability — record the parameter, context, and working payload.

  4. IMMEDIATE ESCALATION TO SPECIALIZED VECTORS:
     - When a discovered parameter accepts a file path (e.g. `file=`, `template=`, `include=`):
       Immediately apply the `web` skill standard: execute `curl --path-as-is` with standard (`../../../../etc/passwd`) and nested (`....//....//....//etc/passwd`) traversal payloads.
     - When a parameter accepts external URLs (e.g. `url=`, `redirect=`):
       Test SSRF against loopback addresses (`http://127.0.0.1:80/`) and cloud metadata endpoints.
