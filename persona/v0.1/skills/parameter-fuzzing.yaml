schema_version: 1
version: 1.1.0
name: parameter-fuzzing
description: Query and body parameter mining, hidden parameter discovery, input reflection testing, and XSS confirmation.
triggers:
  - parameter
  - parameters
  - param mining
  - param fuzzing
  - hidden parameter
  - query string
  - reflection
  - open redirect
  - ssrf parameter
  - xss
  - cross-site scripting
  - dalfox
tools:
  - gau
  - ffuf
  - curl
  - dalfox
knowledge: |
  Discover hidden query/body parameters that unlock injection, SSRF, open redirect, and IDOR vulnerabilities:

  1. HISTORICAL & PASSIVE PARAMETER EXTRACTION:
     - Extract historical URLs containing query parameters from passive search engines and archives:
       `gau --subs <domain> | grep -E '\?' | head -n 100`
     - Extract and de-duplicate unique parameter names across endpoints.

  2. HIDDEN PARAMETER FUZZING:
     - Fuzz for unlinked/hidden GET parameters on high-interest endpoints (e.g. `/profile`, `/api/item`, `/search`):
       `ffuf -u "<url>?FUZZ=test" -w /usr/share/dirb/wordlists/common.txt -mc 200,302 -silent`
     - Fuzz POST JSON parameters on API endpoints:
       `ffuf -u "<url>" -X POST -H "Content-Type: application/json" -d '{"FUZZ":"test"}' -w /usr/share/dirb/wordlists/common.txt -silent`

  3. REFLECTION & BEHAVIOR TRIAGE:
     - Identify parameters whose values are reflected in the HTTP response body or headers (candidates for XSS or header injection).
     - Identify parameters accepting URLs or file paths (`url=`, `redirect=`, `file=`, `dest=`, `src=`) as candidates for SSRF or Open Redirect.

  4. XSS CONFIRMATION — don't stop at "reflected," confirm it. For every URL
     with a reflected parameter found in step 3, run it through dalfox:
       `dalfox url "<url>?param=test" --silence`
     A dalfox hit is a confirmed XSS finding (payload + injection point), not
     just a candidate — record it as such, distinct from an unconfirmed
     reflection.

  5. RECORDING FINDINGS:
     - Record each discovered parameter, the target URL, the request method, and the observable differential response.
     - Confirmed XSS findings get their own entry with the exact payload and parameter, separate from the general parameter inventory.
references:
