schema_version: 1
version: 2.1.0
name: vuln-scanning
description: Senior template-based vulnerability scanning and signature triage with nuclei.
triggers:
  - nuclei
  - vulnerability scan
  - vuln scan
  - cve scan
  - template scan
  - misconfig scan
  - exposure scan
  - subdomain takeover
  - takeover
  - dangling cname
tools:
  - nuclei
knowledge: |
  nuclei matches targeted CVE and misconfiguration signatures against
  verified live services.

  TOOLING: prefer `nuclei_scan(target, tags, severity, output_file)` over a
  raw shell command — one tool call instead of a shell chain avoids the
  operator-approval system's chained-command risk floor. `target` can be a
  single URL/host OR an absolute path to a file of many hosts (one per
  line, e.g. `/home/pentester/work/<domain>/subs.txt`) — passing a file
  path automatically switches to a bulk scan with concurrency/timeout/retry
  values already tuned for scanning many hosts without exhausting the whole
  call on a handful of slow/unresponsive ones.

  1. TARGETED TEMPLATE FILTERING:
     - Run targeted template categories rather than dumping the entire template library:
       `nuclei_scan(target, tags="cve,exposure,auth-bypass,misconfig", severity="low,medium,high,critical")`.
     - When specific technology was already identified (e.g. Spring, Laravel, Jenkins, Nginx):
       `nuclei_scan(target, tags=<technology>)`.

  2. SUBDOMAIN TAKEOVER — run this against EVERY subdomain list osint-enum
     produces, not just the primary target. One of the highest-value,
     lowest-effort bug classes: a dangling CNAME pointing at an unclaimed
     cloud resource (S3, GitHub Pages, Heroku, Azure, etc.) is a full
     takeover, not a "maybe":
       `nuclei_scan(target=<path to subs.txt>, tags="takeover")`.
     A hit here is a critical/high finding on its own — don't bury it in
     general scan noise. A name with no DNS record at all cannot have a
     dangling CNAME, so if a very large candidate list is taking too long
     even with this tool's own bulk tuning, prioritize finishing the
     smaller real-enumeration + resolved-hosts set first and report which
     set was actually covered.

  3. OPERATIONAL TEMPO & RATE DISCIPLINE:
     - A single-target scan already runs at nuclei's own sane defaults; bulk
       (file-path target) mode is auto-tuned by the tool itself — no extra
       concurrency/rate flags to set yourself in either case.

  4. TRIAGE & FALSE-POSITIVE FILTERING:
     - Treat template matches with high/critical severity as priority investigation leads.
     - Verify version-detection hits against exact HTTP response headers / HTML bodies.
     - Record the Template ID, matched URL, and exact vulnerability classification as evidence.
references:
