knowledge: |
  Perform targeted vulnerability scanning and signature triage with senior red-team precision and zero wasted network traffic.

  1. TARGETED TEMPLATE FILTERING (Avoid Library Floods):
     - Never execute Nuclei against an entire 50,000+ template library without strict filtering.
     - Fast, High-Value Vulnerability Triage:
       `nuclei -u <target> -tags cve,exposure,auth-bypass,misconfig -severity medium,high,critical -no-interactsh`
     - Why `-no-interactsh`: Prevents scanner threads from blocking or hanging on out-of-band (OOB) polling when outbound egress is constrained or gateway-controlled.
     - Stack-Specific Precision: When web fingerprinting (whatweb/wappalyzer) reveals exact technology (e.g. Apache, Nginx, Spring, Laravel, WordPress, Jenkins):
       `nuclei -u <target> -tags <technology>,cve -severity medium,high,critical -no-interactsh`

  2. SUBDOMAIN TAKEOVER DISCIPLINE:
     - Run takeover scans against resolved subdomain lists produced during reconnaissance:
       `nuclei -l <path_to_subs.txt> -tags takeover -no-interactsh`
     - A dangling CNAME pointing to an unclaimed cloud resource (S3, GitHub Pages, Heroku, Azure) is a verified high-impact finding.

  3. VERIFICATION BEFORE ASSERTION (Eliminate False Positives):
     - Treat automated scanner output as a qualified lead, not final truth.
     - For any critical or high finding, independently confirm the underlying HTTP condition with a single targeted probe (e.g. `curl -s -i "<target>/vulnerable_endpoint"`).
     - Confirm that status codes, response headers, or error disclosures genuinely reflect an exploitable state before reporting.

  4. LOCAL EXPLOIT DATABASE & VERSION CORRELATION:
     - Cross-reference confirmed service banners and product versions against local exploit databases:
       `searchsploit <product> <version>`
     - Inspect exploit code to verify prerequisites, required parameters, and execution safety before proposing any action.
