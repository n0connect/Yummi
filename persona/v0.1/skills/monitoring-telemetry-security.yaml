schema_version: 1
version: 3.0.0
name: monitoring-telemetry-security
description: >
  Enterprise observability and telemetry infrastructure security assessment — Elasticsearch/Kibana unauthenticated
  indices, Jaeger/Zipkin distributed trace leakage, and OpenTelemetry collector endpoint security.
triggers:
  - elasticsearch
  - kibana
  - opentelemetry
  - jaeger
  - telemetry
  - splunk
  - distributed tracing
  - logging infrastructure
tools:
  - curl
  - python3
knowledge: |
  Enterprise observability stacks (Elasticsearch, Kibana, OpenTelemetry, Jaeger, Splunk) aggregate
  production application logs, distributed traces, and audit events. Unauthenticated access exposes
  credentials, internal microservice call graphs, and customer PII.

  1. ELASTICSEARCH REST API AUDIT (PORT 9200):
     - Cluster Health & Info:
       curl -s "http://target:9200/"
       curl -s "http://target:9200/_cat/health?v"
     - Index Enumeration:
       curl -s "http://target:9200/_cat/indices?v"
       Search for sensitive index naming: `*log*`, `*audit*`, `*user*`, `*auth*`, `*payment*`.
     - Document Search & Credential Extraction:
       `curl -s "http://target:9200/*log*/_search?q=(password+OR+token+OR+secret+OR+authorization)&size=10"`
       Query logs for reflected bearer tokens, database connection errors, and stack traces.

  2. KIBANA CONSOLE & DASHBOARD EXPOSURE (PORT 5601):
     - Status & Version:
       curl -s "http://target:5601/api/status"
     - Unauthenticated Dev Tools:
       If authentication is disabled, navigate to `app/dev_tools#/console` to execute arbitrary Elasticsearch queries.
     - Saved Objects Export:
       `curl -s "http://target:5601/api/saved_objects/_find?type=index-pattern"`

  3. JAEGER & DISTRIBUTED TRACE COLLECTION (PORTS 16686 / 4317 / 4318):
     Jaeger / OpenTelemetry collectors capture request spans across microservices:
     - Trace API Query:
       `curl -s "http://target:16686/api/traces?service=auth-service&limit=10"`
     - Extracted Intelligence:
       Spans include HTTP query parameters, headers, internal RPC endpoints, database queries (db.statement),
       and upstream service identities.

  4. OPENTELEMETRY COLLECTOR UNPROTECTED RECEIVERS:
     - OTLP HTTP receiver (Port 4318):
       Test sending trace telemetry without authentication to verify if unauthorized injection of fake spans is accepted.
     - OTLP gRPC receiver (Port 4317):
       Inspect reflection or RPC service definitions.

  5. EVIDENCE & REMEDIATION DISCIPLINE:
     - Capture index count, cluster name, and a redacted sample document proving unauthenticated exposure.
     - Never delete, reindex, or modify existing indices or traces during security testing.
references:
