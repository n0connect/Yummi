knowledge: |
  Analyze native binaries and firmware methodically from static triage to deep disassembly and controlled dynamic tracing.
  Never execute an untrusted binary without sandbox isolation.

  1. BINARY ARCHITECTURE & MITIGATION TRIAGE (Static):
     - Identify binary architecture, endianness, and dynamic linking:
       `file <binary>`
     - Audit binary protections (RELRO, Stack Canary, NX, PIE, ASLR):
       `checksec_audit(file=<binary>)`
       • Missing Canary: vulnerable to stack buffer overflows.
       • No NX / Executable Stack: shellcode execution on the stack.
       • Partial RELRO / No PIE: static GOT addresses suitable for GOT overwrite.
     - Inspect headers and shared library dependencies:
       `readelf -h <binary>` and `readelf -d <binary>`

  2. STRING & SYMBOL SIGNAL EXTRACTION:
     - Extract high-signal ASCII/Unicode strings (URLs, IPs, API keys, paths, formatting strings):
       `strings -a -n 6 <binary> | grep -E 'http|admin|key|secret|pass|token|api|debug|flag|/bin/'`
     - Dump exported, imported, and internal function symbols:
       `readelf -s --wide <binary>` and `nm -D <binary>`
     - Flag dangerous C runtime API imports:
       `strcpy`, `strcat`, `sprintf`, `vsprintf`, `gets`, `system`, `popen`, `execve`.

  3. DISASSEMBLY & CONTROL-FLOW WITH RADARE2:
     - Analyze functions and disassemble the main routine non-interactively:
       `radare2_disasm(file=<binary>, command="aaa; afl")` (list all identified functions)
       `radare2_disasm(file=<binary>, command="aaa; s main; pdf")` (disassemble main function)
     - Trace cross-references (xrefs) to sensitive strings and dangerous APIs:
       `radare2_disasm(file=<binary>, command="aaa; iz")` (list data section strings)
       `radare2_disasm(file=<binary>, command="aaa; axt @@ str.*")` (trace string cross-references)
       `radare2_disasm(file=<binary>, command="aaa; axt sym.imp.system")` (trace callers of system())

  4. DYNAMIC BEHAVIORAL TRACING (Controlled Sandbox Execution):
     - Trace system calls (file access, network sockets, child process spawning):
       `strace -f -e trace=file,network,process,desc -o /home/pentester/work/strace.log <binary> <args>`
     - Trace dynamic library calls and string comparisons:
       `ltrace -f -s 128 -e malloc+free+strcmp+strncmp+strcpy+system+execve <binary> <args>`

  5. FIRMWARE & EMBEDDED PAYLOAD UNPACKING:
     - Scan and extract embedded files, archives, and compressed file systems:
       `binwalk -Me <binary_or_firmware>`

  6. STRUCTURED FINDINGS & REMEDIATION GUIDANCE:
     - Document exact virtual memory offsets (`0x08048450`), function names, or evidence strings.
     - Categorize findings: Hardcoded Secrets, Missing Stack Protections (No Canary / RWX Segments),
       Command Injection sinks, Memory Corruption risks, or Suspicious Network Communications.
