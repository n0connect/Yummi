knowledge: |
  Analyze binaries methodically from low-risk static triage to deep disassembly and controlled dynamic tracing.
  Never guess or execute an unknown binary blindly:

  1. BINARY TRIAGE & MITIGATION AUDIT (Static, Non-Invasive):
     - Identify architecture, endianness, and linking: `file <binary>`
     - Audit binary protections (RELRO, Stack Canary, NX, PIE, ASLR): `checksec --file=<binary>`
     - Inspect headers and shared library dependencies: `readelf -h <binary>` and `readelf -d <binary>`

  2. STRING & SYMBOL SIGNAL HARVESTING:
     - Extract high-signal strings (URLs, IPs, API keys, paths, formatting strings):
       `strings -a -n 6 <binary> | grep -E 'http|admin|key|secret|pass|token|api|debug|flag|/bin/'`
     - Dump exported, imported, and internal function symbols:
       `readelf -s --wide <binary>` and `nm -D <binary>`
     - Look for dangerous C runtime APIs: `strcpy`, `strcat`, `sprintf`, `gets`, `system`, `popen`, `execve`.

  3. DISASSEMBLY & CROSS-REFERENCE ANALYSIS WITH RADARE2:
     - Analyze functions and disassemble the entrypoint/main function non-interactively:
       `r2 -q -c "aaa; afl" <binary>` (list all detected functions)
       `r2 -q -c "aaa; s main; pdf" <binary>` (disassemble main function)
     - Trace cross-references to sensitive strings and sensitive APIs:
       `r2 -q -c "aaa; iz" <binary>` (list data section strings)
       `r2 -q -c "aaa; axt @@ str.*" <binary>` (find xrefs to all strings)
     - Trace callers of critical functions (e.g. sym.imp.system or sym.imp.strcpy):
       `r2 -q -c "aaa; axt sym.imp.system" <binary>`

  4. DYNAMIC BEHAVIORAL TRACING (Controlled Sandbox Execution):
     - Trace system calls (file access, network sockets, child process execution):
       `strace -f -e trace=file,network,process,desc -o /tmp/strace.log <binary> <args>`
     - Trace dynamic library calls and string comparisons:
       `ltrace -f -s 128 -e malloc+free+strcmp+strncmp+strcpy+system+execve <binary> <args>`

  5. FIRMWARE & EMBEDDED PAYLOAD UNPACKING:
     - Scan and extract embedded files, archives, and compressed file systems:
       `binwalk -Me <binary_or_firmware>`

  6. TRIAGE & STRUCTURED FINDINGS:
     - Record findings with exact virtual addresses (`0x08048450`), function names, or evidence strings.
     - Categorize findings: Hardcoded Secrets, Missing Stack Protections (No Canary / RWX Segments),
       Command Injection sinks, Memory Corruption risks, or Suspicious Network Communications.
