  Red team Command & Control (C2) infrastructure operations covering open-source C2 framework
  selection, listener/payload configuration, staged delivery via living-off-the-land (LOTL)
  techniques, traffic obfuscation, malleable C2 profiles, domain fronting, DNS C2,
  and operator OPSEC. Focused on network-level covertness and detection evasion for authorized engagements.
