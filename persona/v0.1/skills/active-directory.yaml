schema_version: 1
version: 3.0.0
name: active-directory
description: >
  Active Directory domain architecture and identity assessment — LDAP directory querying, BloodHound
  graph enumeration, DACL/ACE permission abuse (GenericAll, WriteDacl), GPO misconfigurations, and domain trust analysis.
triggers:
  - active directory
  - ad
  - domain controller
  - bloodhound
  - ldap enum
  - dacl abuse
  - gpo abuse
  - domain trusts
  - laps
tools:
  - netexec
  - rpcclient
  - python3
knowledge: |
  Assess Active Directory enterprise environments with senior red-team precision. Focus on structural
  identity graphs, object ownership, discretionary access control lists (DACLs), and group policy objects.

  1. DOMAIN RECONNAISSANCE & LDAP QUERYING:
     Identify domain architecture and Domain Controllers without causing excessive event noise:
     - Anonymous / Guest LDAP bind test (Port 389 / 636):
       ldapsearch -x -H ldap://DC_IP -b "DC=domain,DC=local" -s base "(objectClass=*)" namingContexts
     - Authenticated Domain Enumeration:
       Query domain functional level, forest trusts, and active domain controllers:
       netexec ldap DC_IP -u 'USER' -p 'PASS' --query "(objectCategory=computer)"
     - LAPS (Local Administrator Password Solution) Attribute Check:
       Check if user has rights to read ms-Mcs-AdmPwd (plain-text local administrator password):
       ldapsearch -x -H ldap://DC_IP -D "USER@DOMAIN" -w 'PASS' -b "DC=domain,DC=local" "(ms-Mcs-AdmPwd=*)" ms-Mcs-AdmPwd

  2. BLOODHOUND GRAPH ENUMERATION & SHORTEST PATH ANALYSIS:
     Collect domain relationships and trust edges for graph-based pathfinding:
     - Run collector (SharpHound / bloodhound-python):
       bloodhound-python -u 'USER' -p 'PASS' -d domain.local -dc dc.domain.local -c All --zip
     - High-Value Graph Queries:
       • Shortest Paths to Domain Admins
       • Shortest Paths to Unconstrained Delegation Systems
       • Principals with DCSync (DS-Replication-Get-Changes-All) Rights
       • Users with WriteDacl or GenericAll over high-privilege groups

  3. DACL & OBJECT PERMISSION ABUSE:
     When a compromised principal possesses write permissions over another AD object:
     - `GenericAll` / `GenericWrite`:
       Target is a User: Reset user password directly via shadow credentials or password reset.
       Target is a Group: Add compromised account to target group (`net group "TargetGroup" USER /add /domain`).
     - `WriteDacl`:
       Grant compromised user full rights (`GenericAll`) over the target object, then execute control path.
     - `WriteOwner`:
       Take ownership of target object, grant own user `WriteDacl`, and escalate privileges.

  4. GROUP POLICY OBJECT (GPO) MISCONFIGURATION:
     Inspect writable GPOs applied to high-value organizational units (OUs):
     - Identify GPOs where compromised user has Write / Edit permissions:
       netexec smb DC_IP -u 'USER' -p 'PASS' --gpo
     - Immediate scheduled task injection or startup script modification applied across all OU machines.

  5. EVIDENCE & SITUATION HANDLING:
     - If Kerberos pre-authentication or LDAP signing is enforced (`LDAP_STRONG_AUTH_REQUIRED`):
       Switch transport to LDAPS (Port 636) with certificate validation flags.
     - Document all queried principals, edge traversal paths, and permission grants.
references:
