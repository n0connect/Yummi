name: ad-kerberos-advanced
description: Senior Active Directory Kerberos delegation and credential assessment — AS-REP roasting, Kerberoasting SPNs, unconstrained/constrained delegation, and RBCD attack paths.
triggers:
  - kerberos
  - kerberoast
  - asrep
