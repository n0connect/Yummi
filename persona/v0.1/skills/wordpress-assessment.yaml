schema_version: 1
version: 1.0.0
name: wordpress-assessment
description: WordPress-specific vulnerability and enumeration scanning with wpscan.
triggers:
  - wordpress
  - wp-admin
  - wp-content
  - wpscan
  - wp-login
tools:
  - wpscan
knowledge: |
  Only reach for this once whatweb/curl has actually confirmed WordPress (wp-content in a
  response, an X-Powered-By or generator meta tag, /wp-login.php resolving) — wpscan against
  a non-WordPress target just wastes a step.
  1. `wpscan --url <url>` for a baseline pass — core version, exposed plugins/themes, users.
  2. An outdated core/plugin/theme version with a known CVE is a strong finding — record the
     exact version and the CVE if wpscan cites one.
  3. Enumerated usernames feed a later credential-attack subtask against wp-login.php — record
     them even if wpscan doesn't flag them as a vulnerability by itself.
  4. Don't attempt login brute-forcing from within this skill — that's credential-attack's job
     (hydra's http-post-form module), keep concerns separated.
references:
  - persona:wordpress-assessment-v1
provenance:
  origin: builtin
  source: persona/v0.1/skills/wordpress-assessment.yaml
