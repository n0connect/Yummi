schema_version: 1
version: 1.0.0
name: system-inspection
description: Grounded local host inspection for files, packages, resources, and privilege configuration.
triggers:
  - system
  - sistem
  - hostname
  - python
  - shell
  - uptime
  - memory
  - ram usage
  - free ram
  - mysql
  - postgresql
  - largest
  - büyük
  - dosya
  - /var
  - sudo
  - yönetici
tools:
  - find
  - stat
  - getent
  - id
  - awk
  - sort
knowledge: |
  Treat local inspection as an evidence-collection task, not a privilege-escalation task:
  1. Match the primitive to the noun in the goal. For largest FILES, use the portable pattern
     `find <path> -type f -printf '%s\t%p\n' 2>/dev/null | sort -nr | head -3` (largest first);
     `du <path>/*` ranks directories and does not answer a largest-files question. Suppress
     inaccessible-path noise only after preserving useful output. Plan this as ONE atomic step:
     the pipeline both collects and ranks the files, so a second "sort/analyze" step is redundant.
  2. To identify administrative users without root, inspect identity databases with `getent group`
     (sudo, admin, wheel) and readable sudoers configuration. Do not invoke `sudo` merely to learn
     who has sudo rights; that tests the current process, not the system's membership data.
  3. For optional software, probe both the executable path and version. A missing executable is
     valid negative evidence; report absence plainly and never invent a version.
  4. Prefer focused resource sources such as `/proc/meminfo`, `uptime`, and explicit version commands.
     Preserve exact values and units in the final report.
references:
  - persona:system-inspection-v1
provenance:
