name: system-inspection
description: Senior local host triage, privilege escalation vectors, SUID/capability discovery, and system architecture inspection.
triggers:
  - system
  - sistem
  - hostname
  - shell
  - uptime
  - memory
  - privilege escalation
  - privesc
  - suid
  - sudo
  - capabilities
  - cron
