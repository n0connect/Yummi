schema_version: 1
version: 3.0.0
name: system-inspection
description: >
  Local host situational awareness and environment enumeration — OS distribution, kernel version,
  hardware architecture, network interfaces, mount points, active processes, and user context.
triggers:
  - system inspection
  - host awareness
  - sistem inceleme
  - environment discovery
  - os release
  - uname
  - whoami
  - local discovery
  - hostname
  - system info
tools:
  - id
  - uname
  - df
  - ps
  - ip
knowledge: |
  Perform local host situational awareness as an algorithmic, non-invasive discovery pass.
  Establish complete baseline environmental context before planning active privilege escalation.

  1. OS & KERNEL BASELINE IDENTIFICATION:
     Determine distribution, kernel release, and hardware architecture:
       uname -a
       cat /etc/os-release 2>/dev/null || cat /etc/issue
     Identify containerization / virtualization flags:
       systemd-detect-virt 2>/dev/null
       grep -qa container= /proc/1/environ 2>/dev/null

  2. USER CONTEXT & PRIVILEGE BOUNDARIES:
     Inspect current security principal and group memberships:
       id
     Check active login sessions and recent activity:
       who; w; last -n 5

  3. NETWORK INTERFACES & ROUTING FABRIC:
     Identify internal networks and neighboring systems:
       ip -br addr
       ip route
       ip neigh (ARP neighbors)
     Check local listening services (unexposed internal daemons):
       ss -tulpn

  4. STORAGE, MOUNTS & FILESYSTEM MAP:
     Identify disk partitioning and sensitive mounts:
       df -hT
       mount | grep -E "(ext4|xfs|nfs|cifs|tmpfs)"
     Check for noexec, nosuid mount flags on /tmp and /dev/shm.

  5. SYSTEM HEALTH & EXECUTION CONTEXT:
     Check uptime and resource constraints:
       uptime
       free -m
references:
  - https://attack.mitre.org/techniques/T1082/
  - https://attack.mitre.org/techniques/T1033/
