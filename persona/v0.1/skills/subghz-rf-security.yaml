name: subghz-rf-security
description: >
  Sub-GHz Software-Defined Radio (SDR) physical security assessment for 315/433/868/915 MHz bands.
  Covers spectrum scanning, IQ signal capture/demodulation, fixed code replay verification,
  rolling code (Keeloq) analysis, and radio frequency telemetry inspection using SDR platforms.
