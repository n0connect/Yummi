name: parameter-discovery
description: Heuristic HTTP parameter discovery and mining with arjun, ffuf, and curl across GET, POST, JSON, and XML bodies.
triggers:
  - parameter discovery
  - arjun
  - hidden params
  - query fuzzing
  - post fuzzing
  - json fuzzing
  - param miner
  - hidden parameters
tools:
  - arjun
  - ffuf
  - curl
knowledge: |
  Discover hidden request parameters across endpoints to uncover unlinked functionality, administrative overrides, and injection entry points.

  1. HEURISTIC AUTOMATED MINING (arjun):
     - Use `arjun` to discover hidden parameters using heuristic response-differential chunking:
       • GET query parameters: `arjun -u "<url>" -m GET`
       • POST form parameters: `arjun -u "<url>" -m POST`
       • POST JSON object keys: `arjun -u "<url>" -m JSON`
       • XML attributes: `arjun -u "<url>" -m XML`
     - Save discovered parameters for immediate behavioral verification.

  2. MANUAL & FFUF DIFFERENTIAL CONFIRMATION:
     - Confirm response variations between baseline requests and candidate parameters:
       `curl -s "<url>?<discovered_param>=1"` vs `curl -s "<url>"`
     - Observe changes in HTTP status codes, response lengths, reflected values, or execution headers.

  3. PRIVILEGED OVERRIDES & DEBUG FLAGS:
     - Check common administrative and debugging override parameters:
       `debug=true`, `test=1`, `admin=1`, `show_errors=1`, `format=json`, `impersonate=<user>`
     - When a parameter accepts file paths or URLs (`file=`, `url=`, `redirect=`):
       Immediately apply the `web` skill standard: verify directory traversal using `curl --path-as-is` with standard and nested dot-dot sequences.
