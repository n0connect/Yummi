knowledge: |
  Discover hidden query parameters, API body attributes, and administrative overrides with senior heuristic response-differential analysis.

  1. HEURISTIC PARAMETER MINING ACROSS HTTP METHODS (arjun):
     - Use `arjun` to discover hidden query parameters and request bodies:
       • GET query parameters: `arjun -u "<url>" -m GET -oT /home/pentester/work/arjun_get.txt`
       • POST form parameters: `arjun -u "<url>" -m POST -oT /home/pentester/work/arjun_post.txt`
       • POST JSON object keys: `arjun -u "<url>" -m JSON -oT /home/pentester/work/arjun_json.txt`
       • XML request bodies: `arjun -u "<url>" -m XML -oT /home/pentester/work/arjun_xml.txt`

  2. HIGH-VALUE ADMINISTRATIVE & OVERRIDE CANDIDATES:
     - Always test common routing and authorization override parameters:
       `debug=true`, `test=1`, `admin=1`, `dev=1`, `view_as=admin`, `impersonate=1`, `format=json`, `raw=1`, `enable_feature=all`.
     - Test environment and configuration switches:
       `env=test`, `show_debug=true`, `internal=true`, `dry_run=false`.

  3. DIFFERENTIAL CONFIRMATION & BEHAVIORAL VERIFICATION:
     - Establish baseline response:
       `curl -s "<url>" | wc -c`
     - Compare candidate parameter response:
       `curl -s "<url>?<discovered_param>=1" | wc -c`
     - Note significant differences: HTTP status changes (403 -> 200, 200 -> 500), new response headers, or additional JSON properties returned.

  4. HANDOFF TO EXPLOITATION PLAYBOOKS:
     - Discovered file parameters (`file=`, `path=`, `doc=`) -> Immediately pass to `path-traversal-lfi`.
     - Discovered URL parameters (`url=`, `redirect=`, `next=`, `dest=`) -> Pass to `ssrf` and `open-redirect`.
     - Discovered command parameters (`cmd=`, `exec=`, `run=`) -> Pass to `command-injection`.
