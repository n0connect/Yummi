version: 3.0.0
name: secret-mining
description: Senior client-side credential extraction, JavaScript AST parsing, source map reconstruction, and cloud API key mining.
triggers:
  - secret mining
  - jsluice
  - js analysis
  - api keys
  - tokens
  - hardcoded credentials
  - credential leak
  - javascript secrets
  - source maps
  - git leak
tools:
  - jsluice
  - curl
  - katana
knowledge: |
  Extract hardcoded credentials, cloud API tokens, internal endpoints, and original source trees with senior red-team precision.

  1. JAVASCRIPT BUNDLE & SOURCE MAP HARVESTING:
     Single Page Applications (React, Vue, Angular, Next.js) compile backend logic and client secrets into static JavaScript bundles:
     - Bundle Discovery:
       Extract all script tags and dynamically loaded chunks:
       `katana -u "<target_url>" -jc -d 2 | grep -E '\.js$' > /home/pentester/work/js_urls.txt`
     - Source Map Extraction (.js.map):
       Check if source maps were published to production:
       `curl -s -I "<bundle_url>.map" | grep "HTTP/"`
       If the `.map` file exists, reconstruct the entire original unminified TypeScript/React source tree (including developer comments, internal API paths, and raw credentials).

  2. AUTOMATED AST PARSING & ENDPOINT MINING (jsluice):
     - Prefer `jsluice` over naive grep for AST-aware syntax tree extraction:
       • Extract all API endpoints and URL paths:
         `jsluice urls -R /home/pentester/work/js_bundles/`
       • Extract embedded secrets, cryptographic keys, and authorization headers:
         `jsluice secrets -R /home/pentester/work/js_bundles/`

  3. HIGH-SIGNAL CLOUD & SERVICE KEY PATTERNS:
     Search extracted bundles for distinct vendor key signatures:
     - Amazon Web Services:
       `AKIA[0-9A-Z]{16}` (AWS Access Key ID)
     - Google Cloud / Firebase:
       `AIza[0-9A-Za-z_-]{35}` (Google API Key)
     - GitHub Personal Access Tokens:
       `ghp_[0-9a-zA-Z]{36}` or `github_pat_[0-9a-zA-Z_]{82}`
     - Stripe API Keys:
       `sk_live_[0-9a-zA-Z]{24}`
     - Slack Webhooks & Tokens:
       `https://hooks.slack.com/services/T[0-9A-Z]{8}/B[0-9A-Z]{8}/[0-9a-zA-Z]{24}`
     - SendGrid / Mailgun API Keys:
       `SG\.[a-zA-Z0-9_-]{22}\.[a-zA-Z0-9_-]{43}`

  4. CODE REPOSITORY EXPOSURE (GIT / SVN LEAKS):
     - Probe target web root for exposed version control metadata:
       `curl -s "<target_url>/.git/HEAD"` -> Check for `ref: refs/heads/`
       `curl -s "<target_url>/.git/config"` -> Check for remote repository URLs and credentials
     - If `.git` is reachable, use `git-dumper` to reconstruct the complete commit history and extract credentials committed in past revisions.

  5. VERIFICATION & MINIMAL STEP TRIAGE:
     - Verify candidate API keys non-destructively:
       • AWS: `aws sts get-caller-identity`
       • Google: query a public metadata endpoint without modifying state
     - Document file source, line reference, secret category, and potential impact deterministically.
