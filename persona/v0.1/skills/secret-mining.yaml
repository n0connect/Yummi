schema_version: 1
version: 1.0.0
name: secret-mining
description: Static analysis and extraction of endpoints, API keys, tokens, and hardcoded secrets from client-side JavaScript.
triggers:
  - secret mining
  - jsluice
  - js analysis
  - api keys
  - tokens
  - hardcoded credentials
  - credential leak
  - javascript secrets
tools:
  - jsluice
  - curl
  - katana
knowledge: |
  Extract hardcoded secrets, API tokens, internal endpoints, and hidden routes from JavaScript
  assets and single page application bundles.

  TOOLING: Prefer `jsluice_scan` for parsing JavaScript AST to extract URLs and secrets.
  Use `katana_crawl` to locate script tags and bundle URLs.

  1. JAVASCRIPT ASSET DISCOVERY:
     - Crawl target to collect all external and inline script URLs.
     - Download JavaScript files and source maps into the session work directory.

  2. ENDPOINT & URL MINING:
     - Extract all relative and absolute endpoints from JS files:
       `jsluice_scan(target="<url_or_file>", mode="urls")`.
     - Filter extracted paths for internal or unauthenticated routes (`/admin/*`, `/api/internal/*`, `/v1/*`).

  3. SECRET & TOKEN EXTRACTION:
     - Scan JS bundles for embedded credentials, API keys, and cloud tokens:
       `jsluice_scan(target="<url_or_file>", mode="secrets")`.
     - Target key patterns: AWS Access Keys, Google API Keys, Firebase URLs, Stripe Keys, JWT tokens, and OAuth client secrets.

  4. VERIFICATION & RECORDING:
     - Validate extracted endpoints using `curl_probe`.
     - Record identified secrets with file source, line reference, secret type, and potential impact.
references:
  - persona:secret-mining-v1
provenance:
