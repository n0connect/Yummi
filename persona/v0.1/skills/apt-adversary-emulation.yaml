name: apt-adversary-emulation
description: >
  Advanced Persistent Threat (APT) adversary emulation tradecraft adhering to MITRE ATT&CK.
  Focuses on living-off-the-land binaries (LOLBAS/GTFOBins), low-and-slow operational tempo,
  reversibility discipline, minimal artifact footprint, and multi-stage campaign path modeling.
