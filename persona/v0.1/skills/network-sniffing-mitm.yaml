name: network-sniffing-mitm
description: Senior internal network link-layer and Man-in-the-Middle (MITM) assessment — LLMNR/NBT-NS poisoning, SMB signing auditing, NTLM relaying, and WPAD spoofing.
triggers:
  - mitm
  - responder
  - llmnr
