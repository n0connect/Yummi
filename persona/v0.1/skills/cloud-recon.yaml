name: cloud-recon
description: Senior multi-cloud asset enumeration — Amazon S3, Google Cloud Storage, Azure Blob containers, CDN origin unmasking, and serverless endpoint discovery.
triggers:
  - cloud recon
  - cloud enum
  - s3 buckets
  - gcs buckets
  - azure blob
  - cloud storage
  - cloudflare bypass
  - aws asset
  - gcp asset
  - azure asset
tools:
  - cloud_enum
  - curl
  - tlsx
  - naabu
knowledge: |
  Enumerate public cloud infrastructure, object storage assets, CDN origins, and exposed serverless APIs with senior red-team precision.

  1. MULTI-CLOUD STORAGE ENUMERATION & KEYWORD MUTATIONS:
     - Generate focused mutation wordlists based on target brand, subsidiaries, and environment names:
       Keywords: `<company>`, `<company>-dev`, `<company>-prod`, `<company>-staging`, `<company>-backup`, `<company>-data`, `<company>-assets`, `<company>-internal`.
     - Automated Cloud Enumeration:
       `cloud_enum_scan(keyword="<target_keyword>", mutator="cloudenum_mutations.txt")`
       • Amazon S3: `https://<bucket>.s3.amazonaws.com`
       • Azure Blob Storage: `https://<account>.blob.core.windows.net/<container>`
       • Google Cloud Storage: `https://storage.googleapis.com/<bucket>`

  2. UNPROTECTED STORAGE PERMISSION AUDITING:
     - Anonymous Read & Bucket Listing:
       Probe for public XML index listings without authentication:
       `curl -s -I "https://<bucket>.s3.amazonaws.com/?max-keys=5"`
       `curl -s "https://storage.googleapis.com/<bucket>/?prefix="`
       HTTP 200 with `<ListBucketResult>` confirms unauthenticated bucket listing.
     - Unauthenticated Write & Object Upload:
       Test for public write permissions using an ephemeral canary filename:
       `curl -s -X PUT -d "CANARY_VERIFICATION" "https://<bucket>.s3.amazonaws.com/test_canary_probe.txt"`
       (Immediately delete canary probe if write succeeds).

  3. CDN ORIGIN UNMASKING & DIRECT CLOUD ACCESS:
     - When a web target sits behind Cloudflare, CloudFront, or Akamai:
       Enumerate historical DNS and certificate transparency records using `tlsx`:
       `tlsx_scan(targets=["<target_ip_range>"], san=true)`
     - Compare direct web response vs CDN-cached response:
       `curl -s -H "Host: target.com" "http://<direct_cloud_ip>"`
       Bypassing the CDN exposes origin web servers, unauthenticated APIs, and internal debugging interfaces.

  4. SERVERLESS & CLOUD API ENDPOINT MAPPING:
     - Check for unlinked AWS API Gateway, Azure App Service, and GCP Cloud Run instances:
       • AWS API Gateway: `https://<api_id>.execute-api.<region>.amazonaws.com/<stage>/`
       • Azure App Services: `https://<app_name>.azurewebsites.net/`
       • Google Cloud Run: `https://<service_name>-<hash>-<region>.a.run.app/`
     - Extract service configuration, CORS policies, and authentication headers.

  5. SAFE AUDITING STANDARDS:
     - Only verify read access or metadata listing.
     - Never download bulk customer datasets or modify production cloud resources.
