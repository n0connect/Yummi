name: deserialization-attacks
description: >
  Java gadget chain exploitation and polymorphic JSON/YAML typing confusion.
  Covers ysoserial gadget triage, Jackson enableDefaultTyping, PyYAML unsafe loading,
  and safe URLDNS out-of-band oracle confirmation.
