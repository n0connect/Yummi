tools:
  - nmap
knowledge: |
  Perform host and network enumeration systematically with disciplined stealth and accuracy:

  1. FAST PORT SWEEP (Establish Live Ports First):
     - Scan the top TCP ports quickly without DNS resolution delays:
       `nmap -sT -T4 --top-ports 1000 --open -n <target>`
     - For broad IP ranges, run discovery ping sweeps before detailed port scanning:
       `nmap -sn -n <target_cidr>`

  2. TARGETED SERVICE & VERSION DETECTION:
     - Run detailed service detection and default NSE scripts ONLY against open ports:
       `nmap -sV -sC -p <open_ports> -n <target>`
     - Extract banners, protocol versions, and service names without aggressive timing.

  3. FOCUSED UDP RECONNAISSANCE:
     - Probe high-value UDP services (DNS, SNMP, NTP, DHCP, TFTP, IKE):
       `nmap -sU --top-ports 25 -n <target>`

  4. STRUCTURED FINDINGS & SHARED MEMORY:
     - Record each open port, transport protocol (tcp/udp), service name, product version, and host banner as a structured finding.
     - These findings feed subsequent specialized subagents (web, smb-enum, snmp-enum, exploiter).
