knowledge: |
  Assess web application attack surfaces systematically like a senior red-team operator:

  1. FINGERPRINTING & WAF TRIAGE:
     - Identify web server, application framework, CMS, and technologies:
       `whatweb -a 3 <url>`
     - Check for Web Application Firewalls (Cloudflare, AWS WAF, Akamai, Imperva):
       `wafw00f <url>`
     - Inspect security headers (CSP, HSTS, CORS `Origin: null`, Cookie flags `HttpOnly; Secure; SameSite`):
       `curl -sIL <url>`

  2. MODERN ENDPOINT CRAWLING & JAVASCRIPT DISCOVERY:
     - Crawl pages, parse client-side forms, and extract endpoints from loaded JS:
       `katana -u <url> -d 3 -jc -silent`
     - Harvest historical endpoints and parameter names:
       `gau --subs <domain> | head -n 200`

  3. CONTENT & HIDDEN DIRECTORY DISCOVERY:
     - Fuzz directories and file extensions with status code filtering:
       `ffuf -u <url>/FUZZ -w /usr/share/dirb/wordlists/common.txt -mc 200,204,301,302,307,401,403 -silent`
     - For identified 403 Forbidden endpoints, test standard bypass headers:
       `curl -s -H "X-Forwarded-For: 127.0.0.1" -H "X-Custom-IP-Authorization: 127.0.0.1" <url>/admin`

  4. API & CONFIGURATION EXPOSURE PROBING:
     - Check common API documentation paths: `/api/v1`, `/swagger.json`, `/api-docs`, `/openapi.json`, `/graphql`.
     - Check critical exposed files: `/.git/HEAD`, `/.env`, `/.DS_Store`, `/robots.txt`, `/sitemap.xml`.

  5. STRUCTURED EVIDENCE & FINDINGS:
     - Never report generic descriptions. Include exact HTTP status codes, server response headers,
       parameter names, or matched URL paths as verifiable evidence.
