schema_version: 1
version: 3.0.0
name: baas-cloud-databases
description: >
  Backend-as-a-Service (BaaS) and embedded cloud datastore security assessment covering PocketBase,
  Appwrite, Parse Server, and Directus. Focuses on collection-level API rule bypasses, unauthenticated
  schema enumeration, admin token leaks, and client-side database boundary testing.
triggers:
  - baas
  - pocketbase
  - appwrite
  - parse server
  - directus
  - serverless database
  - client database
tools:
  - curl
  - python3
knowledge: |
  Backend-as-a-Service (BaaS) architectures (PocketBase, Appwrite, Parse Server, Directus) expose
  database tables and file storage directly to client-side applications through auto-generated REST APIs.
  Vulnerabilities arise when collection API rules, schema definitions, or admin interfaces are left default.

  1. POCKETBASE API & COLLECTION RULE TESTING:
     PocketBase exposes SQLite collections at `/api/collections/<name>/records`:
     - Schema & Health Discovery:
       curl -s "https://target/api/health"
       curl -s "https://target/api/collections?page=1&perPage=50"
     - Unauthenticated Collection Access:
       Test common collection names without authorization headers:
       `curl -s "https://target/api/collections/users/records"`
       `curl -s "https://target/api/collections/settings/records"`
       If rows return, the collection List/View rule is set to `@request.auth.id != ""` (or left empty for public access).
     - Admin UI Exposure:
       Check `/api/admins` and `/_/` (default admin panel path).

  2. APPWRITE PROJECT & DATABASE SECURITY:
     Appwrite endpoints operate under `/v1/database/collections`:
     - Client Header Configuration:
       Appwrite requires `X-Appwrite-Project: <PROJECT_ID>`. Extract project ID from client JavaScript.
     - Document Read Permissions:
       `curl -s -H "X-Appwrite-Project: PROJECT_ID" "https://target/v1/databases/<databaseId>/collections/<collectionId>/documents"`
       Check if Document Security is disabled, allowing any user with the project ID to query all documents.
     - Storage Bucket File Permissions:
       `curl -s -H "X-Appwrite-Project: PROJECT_ID" "https://target/v1/storage/buckets/<bucketId>/files"`

  3. PARSE SERVER OBJECT & ROLE AUDITING:
     Parse Server endpoints operate under `/parse/classes/<ClassName>`:
     - Client Key & App ID extraction:
       Inspect client headers: `X-Parse-Application-Id`, `X-Parse-REST-API-Key`, `X-Parse-Master-Key`.
     - Master Key Leakage:
       If `X-Parse-Master-Key` is exposed in client bundles, all ACLs and Class-Level Permissions (CLPs) are bypassed!
     - Class-Level Permissions (CLP) Probe:
       `curl -s -H "X-Parse-Application-Id: APP_ID" "https://target/parse/classes/_User"`
       If user profiles and password hashes/tokens return, the CLP public read rule is enabled.

  4. DIRECTUS DATA ENGINE AUDIT:
     Directus REST endpoints: `/items/<collection_name>`
     - Public Role Permissions:
       `curl -s "https://target/items/users"`
       `curl -s "https://target/items/system_settings"`
     - Server Information Leakage:
       `curl -s "https://target/server/info"`
       (Discloses Directus version, underlying database type, and active storage adapters).

  5. VERIFICATION & REMEDIATION DISCIPLINE:
     - Document exact collection names, exposed document attributes, and missing access rules.
     - Never modify, delete, or create rogue records in production collections during testing.
references:
  - https://pocketbase.io/docs/
  - https://appwrite.io/docs/
  - https://parseplatform.org/
