schema_version: 1
version: 3.0.0
name: password-spraying-smart
description: >
  Enterprise password spraying and credential testing with strict lockout threshold protection.
  Covers Active Directory lockout policy discovery (lockoutThreshold, lockoutDuration),
  smart spray window calculation, Kerberos pre-authentication testing, timing-based user enumeration,
  and hybrid dictionary generation (SeasonYear, CompanyName mutations).
triggers:
  - password spraying
  - smart spray
  - credential testing
  - lockout threshold
  - lockout duration
  - badpwdcount
  - kerberos preauth
  - user enumeration
  - credential stuffing
tools:
  - python3
knowledge: |
  Password spraying tests single common passwords against multiple user accounts, inverting
  traditional brute-forcing to bypass per-account lockout policies. A senior operator ALWAYS
  discovers the domain lockout policy before sending a single authentication attempt.

  1. LOCKOUT POLICY DISCOVERY (STEP 0 - NEVER SKIP):
     Before attempting any password attempt, discover the domain policy:
     a. Active Directory / Samba via net accounts:
        net accounts /domain (or via rpcclient: rpcclient -U "" -N DC_IP -c "getdompwinfo")
     b. Extract Key Parameters:
        - Lockout threshold: Number of bad attempts before lock (e.g. 5 attempts).
        - Lockout duration: Minutes an account remains locked (e.g. 30 minutes).
        - Reset account lockout counter after: Minutes before badPwdCount resets (e.g. 30 minutes).
     c. Golden Rule of Password Spraying:
        MAX_ATTEMPTS = lockoutThreshold - 2
        SPRAY_INTERVAL = resetLockoutWindow + 5 minutes
        (Example: If threshold is 5 with 30m window -> Test at most 2-3 passwords per account,
         then SLEEP for 35 minutes before next round).

  2. USERNAME ENUMERATION & TARGET LIST HYGIENE:
     Only spray validated active user accounts to minimize alert noise:
     - Timing-based enumeration:
       Many cloud providers (O365, Google Workspace, Okta) respond faster when an account exists
       vs does not exist, or return distinct error messages ("User does not exist" vs "Incorrect password").
     - Filter out high-risk accounts:
       NEVER spray Administrator, Domain Admins, VIP/Executive accounts, or break-glass accounts
       without explicit authorization — locking a critical service account halts operations!

  3. HYBRID PASSWORDS GENERATION (SEASON + YEAR PATTERNS):
     Corporate password policies (e.g. 8+ chars, uppercase, lowercase, number, special char)
     produce highly predictable employee password choices:
     Top Spray Candidates:
       - Current Season + Current Year + Special: Winter2026!, Spring2026!, Autumn2026@
       - Company Name + Year + Special: TargetCorp2026!, Welcome123!
       - Month + Year: October2026#

  4. PROTOCOL SELECTION (LEAST NOISY FIRST):
     Protocol evaluation for spraying:
     - Kerberos Pre-Authentication (Port 88):
       Fastest and cleanest. Does NOT generate failed logon Event 4625 if AS-REQ pre-auth fails;
       generates Event 4771 (Kerberos pre-auth failed), which is less frequently monitored by basic SIEMs.
     - LDAP / LDAPS (Port 389 / 636):
       Direct simple bind test; returns specific error code data (data 52e = bad creds, data 775 = locked).
     - SMB (Port 445):
       Noisy; generates multiple Event 4625 entries per attempt. Use only if Kerberos/LDAP is unavailable.
     - Single-Sign-On (SSO / O365 / OAuth):
       Spray external cloud identity (Entra ID / Okta) using spray tools with IP rotation proxying.

  5. REAL-TIME BADPWDCOUNT MONITORING:
     If LDAP read access is available (via low-priv user or unauthenticated LDAP):
       Query the 'badPwdCount' attribute of user accounts between rounds:
         ldapsearch -x -H ldap://DC_IP -b "DC=domain,DC=local" "(sAMAccountName=USER)" badPwdCount
       If badPwdCount > 1, immediately remove that account from the active spray queue to prevent lockout!

  6. DOCUMENTATION & REVERSIBILITY:
     - Record every authentication attempt with target username, timestamp, and source IP.
     - Verify zero account lockouts occurred during the assessment window.
