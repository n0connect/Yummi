  - Query unquoted service paths and weak service permissions before attempting exploit binaries.
  - Check AlwaysInstallElevated registry keys.
  - If local admin or backup rights exist, harvest SAM/SYSTEM hives to dump hashes offline.
  - Report findings deterministically with exact registry keys and commands.
planning: |
  Produce a short ordered plan that checks privileges and tokens, inspects service configurations,
  evaluates registry escalation settings, and documents escalation findings.
