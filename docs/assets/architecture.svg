<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yummi's trust-boundary flow: the operator talks to the orchestrator, which execs approved commands directly into the sandbox and separately asks the gateway to open network scope; the gateway's fail-closed nftables rules are the only path from sandbox to the external network, dropping everything by default.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9fb0c3"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3ddc97"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#0b1220"/>

  <text x="32" y="40" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#9fb0c3" letter-spacing="2">YUMMI — TRUST BOUNDARY</text>

  <!-- Operator -->
  <rect x="40" y="90" width="180" height="90" rx="10" fill="#111a2c" stroke="#3a4a63" stroke-width="1.5"/>
  <text x="130" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#e8edf5" font-weight="600">Operator</text>
  <text x="130" y="150" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9fb0c3">Web UI · Desktop · TUI</text>

  <!-- Orchestrator -->
  <rect x="380" y="70" width="220" height="130" rx="10" fill="#111a2c" stroke="#3a4a63" stroke-width="1.5"/>
  <text x="490" y="105" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#e8edf5" font-weight="600">Orchestrator</text>
  <text x="490" y="126" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9fb0c3">Go · REST + WS API</text>
  <text x="490" y="145" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9fb0c3">conductor + agent loop</text>
  <text x="490" y="164" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9fb0c3">never touches nftables</text>

  <!-- Ollama (side box) -->
  <rect x="700" y="90" width="200" height="90" rx="10" fill="#0f1a14" stroke="#2a4536" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="800" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#e8edf5" font-weight="600">Ollama</text>
  <text x="800" y="150" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#7fd9ac">local LLM — zero cloud calls</text>

  <!-- Sandbox -->
  <rect x="380" y="320" width="220" height="110" rx="10" fill="#111a2c" stroke="#3a4a63" stroke-width="1.5"/>
  <text x="490" y="356" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#e8edf5" font-weight="600">Sandbox</text>
  <text x="490" y="377" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9fb0c3">Kali · read-only rootfs</text>
  <text x="490" y="396" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9fb0c3">tool execution only</text>
  <text x="490" y="415" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9fb0c3">no direct route out</text>

  <!-- Gateway (trust boundary — visually distinct) -->
  <rect x="40" y="320" width="240" height="110" rx="10" fill="#0d241c" stroke="#3ddc97" stroke-width="2"/>
  <text x="160" y="352" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#e8edf5" font-weight="600">Gateway</text>
  <text x="160" y="373" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#7fd9ac">Rust · fail-closed nftables</text>
  <text x="160" y="392" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#7fd9ac">DROP-all before IPC opens</text>
  <text x="160" y="411" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#7fd9ac">the only path out for sandbox</text>

  <!-- External network -->
  <rect x="40" y="480" width="240" height="60" rx="10" fill="#111a2c" stroke="#3a4a63" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="160" y="516" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#9fb0c3">external network</text>

  <!-- Arrows -->
  <!-- Operator -> Orchestrator -->
  <line x1="220" y1="135" x2="375" y2="135" stroke="#9fb0c3" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="297" y="122" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#9fb0c3">chat / approve</text>

  <!-- Orchestrator -> Ollama -->
  <line x1="600" y1="125" x2="695" y2="125" stroke="#9fb0c3" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="648" y="112" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#9fb0c3">infer</text>

  <!-- Orchestrator -> Sandbox (exec, accent — the real command path) -->
  <line x1="490" y1="200" x2="490" y2="315" stroke="#3ddc97" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="500" y="240" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7fd9ac">docker exec</text>
  <text x="500" y="256" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7fd9ac">(approved commands only)</text>

  <!-- Orchestrator -> Gateway (IPC control plane) -->
  <path d="M 380 160 C 300 200, 220 260, 175 315" fill="none" stroke="#9fb0c3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="220" y="255" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#9fb0c3">IPC: check / open scope</text>

  <!-- Sandbox -> Gateway (all outbound traffic, accent) -->
  <line x1="380" y1="375" x2="285" y2="375" stroke="#3ddc97" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="332" y="365" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7fd9ac">all outbound</text>

  <!-- Gateway -> External (allowed only) -->
  <line x1="160" y1="430" x2="160" y2="475" stroke="#3ddc97" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="170" y="458" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7fd9ac">allowed targets only</text>

  <!-- Caption strip -->
  <text x="480" y="548" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5c6b81">green = the enforced trust boundary · gray dashed = control-plane checks, not data</text>
</svg>
