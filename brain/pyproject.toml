[project]
name = "yummi-brain"
version = "0.1.0"
description = "Frontier-model agent brain (LangGraph) driving Yummi's fail-closed pentest substrate via MCP."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6.6",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
yummi-mcp-server = "yummi_brain.mcp_server:run"
yummi-brain = "yummi_brain.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yummi_brain"]
