name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple

  # Gated on an ACTUAL release, not just this workflow having run — the
  # singular `release_created` output (not the plural `releases_created`,
  # which is documented but reportedly always true regardless of whether a
  # release happened: https://github.com/googleapis/release-please-action/issues,
  # see also the well-known "beware release-please v4" writeups). Every push
  # to main runs release-please-action itself (it just opens/updates a
  # standing "Release PR" accumulating changes), but this job only runs on
  # the push that MERGES that PR and actually cuts a tag.
  docker-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            dockerfile: gateway/Dockerfile
            context: .
          - image: orchestrator
            dockerfile: orchestrator/Dockerfile
            context: .
          - image: sandbox
            dockerfile: sandbox/Dockerfile
            context: .
          - image: ui
            dockerfile: ui/Dockerfile
            context: ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yummi-${{ matrix.image }}:${{ needs.release-please.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/yummi-${{ matrix.image }}:latest
