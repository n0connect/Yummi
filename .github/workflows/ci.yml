name: CI

on:
  push:
    branches: [main, yummi-dev]
  pull_request:
    branches: [main, yummi-dev]

# Cancel superseded runs on the same branch/PR so pushes don't queue up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-root:
    name: Go (root module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...

  go-orchestrator:
    name: Go (orchestrator module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator/go.mod
      - run: go build ./...
        working-directory: orchestrator
      - run: go test ./...
        working-directory: orchestrator

  go-sandbox-mcp:
    name: Go (sandbox-mcp module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Real tools require the installed sandbox binary, Linux Docker and UID
      # 1000. Never weaken confinement to run live tests on the CI runner.
      - uses: docker/setup-buildx-action@v3
      - name: Build real Kali sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/Dockerfile
          load: true
          tags: yummi/sandbox:local
          cache-from: type=gha,scope=sandbox-ci
          cache-to: type=gha,mode=max,scope=sandbox-ci
      - name: Test sandbox-MCP in isolated Kali
        run: make _test-sandbox-mcp CONTAINER_ENGINE=docker

  go-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sandbox-mcp/go.mod # highest of the three modules' requirements; satisfies the other two via GOTOOLCHAIN=auto
      - name: Lint root module
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: Lint orchestrator module
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: orchestrator
      - name: Lint sandbox-mcp module
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: sandbox-mcp

  go-vuln:
    name: Go vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sandbox-mcp/go.mod # highest of the three modules' requirements; satisfies the other two via GOTOOLCHAIN=auto
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: orchestrator
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: sandbox-mcp

  gateway:
    name: Rust (gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
      - run: cargo test
        working-directory: gateway
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: gateway

  gateway-audit:
    name: Rust vulnerability scan (cargo-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # audit-check opens an issue per new advisory when run on a schedule; harmless on push
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: gateway

  ui:
    name: UI (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
