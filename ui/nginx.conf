server {
    listen 80 default_server;
    server_name _;
    return 403;
}

server {
    listen 80;
    server_name localhost 127.0.0.1 [::1];

    # Published host ports arrive through the dedicated ingress bridge. Sandbox
    # and gateway peers must never inherit the UI proxy's operator authority.
    allow 127.0.0.1;
    allow ::1;
    allow 172.21.0.1;
    allow 172.22.0.1;
    deny all;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy REST API to orchestrator
    location /api/ {
        proxy_pass http://orchestrator:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Proxy WebSocket connections to orchestrator
    location /ws/ {
        proxy_pass http://orchestrator:9080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 86400s;
    }

    # Health probe
    location /healthz {
        proxy_pass http://orchestrator:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Vite content-hashes every filename under /assets/ (e.g.
    # index-DeARK3_h.js), so those files are safe to cache aggressively and
    # immutably — a new build always gets a new filename, never a mutated
    # old one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is the one file that must NEVER be cached the same way:
    # it's what names the current build's hashed asset filenames, and
    # nginx's default response here carries only passive ETag/Last-Modified
    # validators, not an explicit directive — leaving actual behavior up to
    # each browser's own heuristics. Caught live: a browser that had loaded
    # this page before a redeploy kept serving the OLD index.html (and so
    # the OLD JS bundle hash) after the deploy, with no error and no visible
    # sign anything was stale. Forcing revalidation on every load closes
    # that gap for real operators, not just this one reproduction.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
