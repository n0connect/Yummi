  <rect x="60" y="40" width="8" height="8" rx="1" class="pixel" />

  <!-- m -->
  <rect x="80" y="10" width="8" height="8" rx="1" class="pixel" />
  <rect x="90" y="10" width="8" height="8" rx="1" class="pixel" />
  <rect x="100" y="10" width="8" height="8" rx="1" class="pixel" />
  <rect x="110" y="10" width="8" height="8" rx="1" class="pixel" />
