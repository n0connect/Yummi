    <rect x="160" y="30" width="8" height="8" rx="1.5" />
    <rect x="180" y="30" width="8" height="8" rx="1.5" />
    <rect x="140" y="40" width="8" height="8" rx="1.5" />
    <rect x="160" y="40" width="8" height="8" rx="1.5" />
    <rect x="180" y="40" width="8" height="8" rx="1.5" />

    <!-- i -->
    <rect x="200" y="0" width="8" height="8" rx="1.5" />
    <rect x="200" y="20" width="8" height="8" rx="1.5" />
    <rect x="200" y="30" width="8" height="8" rx="1.5" />
    <rect x="200" y="40" width="8" height="8" rx="1.5" />
  </g>
