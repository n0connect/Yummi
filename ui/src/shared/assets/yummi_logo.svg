    <rect x="122" y="33" width="8" height="8" rx="1.5" />
    <rect x="82" y="43" width="8" height="8" rx="1.5" />
    <rect x="102" y="43" width="8" height="8" rx="1.5" />
    <rect x="122" y="43" width="8" height="8" rx="1.5" />

    <rect x="142" y="13" width="8" height="8" rx="1.5" />
