    <rect x="42" y="33" width="8" height="8" rx="1.5" />
    <rect x="62" y="33" width="8" height="8" rx="1.5" />
    <rect x="42" y="43" width="8" height="8" rx="1.5" />
    <rect x="52" y="43" width="8" height="8" rx="1.5" />
    <rect x="62" y="43" width="8" height="8" rx="1.5" />

    <rect x="82" y="13" width="8" height="8" rx="1.5" />
    <rect x="92" y="13" width="8" height="8" rx="1.5" />
    <rect x="102" y="13" width="8" height="8" rx="1.5" />
    <rect x="112" y="13" width="8" height="8" rx="1.5" />
    <rect x="122" y="13" width="8" height="8" rx="1.5" />
    <rect x="82" y="23" width="8" height="8" rx="1.5" />
    <rect x="102" y="23" width="8" height="8" rx="1.5" />
    <rect x="122" y="23" width="8" height="8" rx="1.5" />
