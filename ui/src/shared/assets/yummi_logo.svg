  <rect x="120" y="20" width="8" height="8" rx="1" class="pixel" />
  <rect x="80" y="30" width="8" height="8" rx="1" class="pixel" />
  <rect x="100" y="30" width="8" height="8" rx="1" class="pixel" />
  <rect x="120" y="30" width="8" height="8" rx="1" class="pixel" />
