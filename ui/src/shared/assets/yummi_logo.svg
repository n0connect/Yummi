<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 218 71" width="300" height="98">
  <!-- Single-file wordmark: theme switching lives entirely inside this SVG's
       own CSS (matches the technique the original logo used), so a single
       plain <img> tag works everywhere — GitHub, raw file viewers, and local
       markdown previewers that don't support <picture>/<source>. Depth comes
       from real offset geometry (a shadow layer drawn behind the face layer),
       not an SVG filter, so it renders identically wherever SVG is supported
       at all. -->
  <style>
    .face   { fill: #1a1e24; }
    .shadow { fill: #c4cbd4; }
    @media (prefers-color-scheme: dark) {
      .face   { fill: #f5f8fc; }
      .shadow { fill: #3d4451; }
    }
  </style>

  <!-- shadow layer (drawn first, offset +2,+3) -->
  <g class="shadow">
    <rect x="2" y="13" width="8" height="8" rx="1.5" />
    <rect x="22" y="13" width="8" height="8" rx="1.5" />
    <rect x="2" y="23" width="8" height="8" rx="1.5" />
    <rect x="22" y="23" width="8" height="8" rx="1.5" />
