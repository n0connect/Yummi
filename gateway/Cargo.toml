[package]
name = "yummi-gateway"
version = "1.0.0"
edition = "2021"
description = "Yummi gateway trust boundary — traffic observation and policy enforcement"
license = "Apache-2.0"

[[bin]]
name = "yummi-gateway"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "sync", "io-util", "time"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
serde_yaml = "0.9.34"
rusqlite = { version = "0.31.0", features = ["bundled"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["json", "env-filter"] }
clap = { version = "4.5.4", features = ["derive"] }
thiserror = "1.0.61"
anyhow = "1.0.86"
chrono = { version = "0.4.38", features = ["serde"] }
ipnet = { version = "2.9.0", features = ["serde"] }
uuid = { version = "1.8.0", features = ["v4"] }
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4.4"
tempfile = "3.10.1"
